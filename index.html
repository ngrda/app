          (noteStr ? '<div class="exp-shift-notes">' + noteStr + '</div>' : '') + '</div>';
      }).join('');
      const noteParts = notesArr.map(n => '<div class="exp-note">' + escapeHtml(n.text) + '</div>').join('');
      dayRows.push('<tr><td class="exp-date">' + escapeHtml(fmtHuman(dstr)) + '</td><td>' + shiftParts + noteParts + '</td></tr>');
    }
    d = addDays(d, 1);
  }
  const bodyRows = dayRows.length ? dayRows.join('') :
    '<tr><td colspan="2" class="exp-empty">' + tr('export_no_entries') + '</td></tr>';
  return { bodyRows, totalHours };
}
function exportDayCellHTML(date, compact){
  const dstr = toDateStr(date);
  const entries = entriesFor(dstr);
  const dayNotesArr = notesFor(dstr);
  const dayTypes = [...new Map(entries.map(e=>{ const t=typeById(e.typeId); return t ? [t.id,t] : null; }).filter(Boolean)).values()];
  const chips = dayTypes.map(t=>{
    const label = compact ? shiftAbbr(t.name) : (escapeHtml(t.name) + (t.start && t.end ? ' ' + t.start + '–' + t.end : ''));
    const txtColor = textColorFor(t.color);
    return '<span class="exp-chip" style="background:' + t.color + ';color:' + txtColor + '">' + (compact ? escapeHtml(label) : label) + '</span>';
  }).join('');
  const noteLimit = compact ? 1 : 4;
  const notesHtml = dayNotesArr.slice(0, noteLimit).map(n=>{
    const txt = (n.text || '').trim();
    const shown = compact && txt.length > 14 ? txt.slice(0,14) + '…' : txt;
    return '<div class="exp-cell-note">' + escapeHtml(shown) + '</div>';
  }).join('');
  return '<div class="exp-cell-num">' + date.getDate() + '</div>' +
    (chips ? '<div class="exp-chip-row">' + chips + '</div>' : '') + notesHtml;
}
function monthCellsMatrix(y, m){
  const first = new Date(y, m, 1);
  const startOffset = mondayIndex(first);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for(let i = 0; i < startOffset; i++){ cells.push({ date: addDays(first, -(startOffset - i)), outside: true }); }
  for(let dd = 1; dd <= daysInMonth; dd++) cells.push({ date: new Date(y, m, dd), outside: false });
  while(cells.length % 7 !== 0) cells.push({ date: addDays(cells[cells.length - 1].date, 1), outside: true });
  return cells;
}
function calRowsFromCells(cells, compact){
  const todaystr = todayStr();
  let rows = '';
  for(let i = 0; i < cells.length; i += 7){
    const week = cells.slice(i, i + 7);
    rows += '<tr>' + week.map(c=>{
      const dstr = toDateStr(c.date);
      const cls = 'exp-cal-td' + (c.outside ? ' outside' : '') + (dstr === todaystr ? ' today' : '') + (compact ? ' compact' : '');
      return '<td class="' + cls + '">' + exportDayCellHTML(c.date, compact) + '</td>';
    }).join('') + '</tr>';
  }
  return rows;
}
function buildMonthCalendarBlock(y, m, compact){
  const cells = monthCellsMatrix(y, m);
  const headHtml = '<tr>' + WEEKDAYS.map(w => '<th>' + w + '</th>').join('') + '</tr>';
  const rows = calRowsFromCells(cells, compact);
  return '<div class="exp-cal-month-wrap' + (compact ? ' compact-wrap' : '') + '">' +
    '<div class="exp-cal-title">' + MONTHS[m] + ' ' + y + '</div>' +
    '<table class="exp-cal-table' + (compact ? ' compact' : '') + '"><thead>' + headHtml + '</thead><tbody>' + rows + '</tbody></table>' +
    '</div>';
}
function buildWeekCalendarBlock(start){
  const cells = [];
  for(let i = 0; i < 7; i++) cells.push({ date: addDays(start, i), outside: false });
  const headHtml = '<tr>' + WEEKDAYS.map(w => '<th>' + w + '</th>').join('') + '</tr>';
  const rows = calRowsFromCells(cells, false).replace(/class="exp-cal-td/g, 'class="exp-cal-td week-mode');
  return '<table class="exp-cal-table week-mode"><thead>' + headHtml + '</thead><tbody>' + rows + '</tbody></table>';
}
function buildCalendarSectionHTML(period, start, end){
  if(period === 'weekly') return buildWeekCalendarBlock(start);
  if(period === 'annual'){
    const y = start.getFullYear();
    const blocks = [];
    for(let m = 0; m < 12; m++) blocks.push(buildMonthCalendarBlock(y, m, true));
    let rows = '';
    for(let i = 0; i < blocks.length; i += 3){
      const chunk = blocks.slice(i, i + 3);
      rows += '<tr>' + chunk.map(b => '<td class="exp-year-td">' + b + '</td>').join('') + '</tr>';
    }
    return '<table class="exp-year-table"><tbody>' + rows + '</tbody></table>';
  }
  return buildMonthCalendarBlock(start.getFullYear(), start.getMonth(), false);
}

function clearAllData(){
  state.shifts = {};
  DB.saveShifts(state.shifts);
  closeModal();
  renderApp();
  showToast(tr('toast_all_cleared'));
}
function exportBackupJSON(){
  const backup = {
    app: 'rota', version: 1, exportedAt: new Date().toISOString(),
    shiftTypes: state.shiftTypes, shifts: state.shifts, notes: state.notes, settings: state.settings
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rota-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  showToast(tr('toast_backup_exported'));
}
function triggerImportBackup(){
  const input = document.getElementById('backupFileInput');
  if(input){ input.value = ''; input.click(); }
}
async function importBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('invalid backup');
    state.shiftTypes = Array.isArray(data.shiftTypes) ? data.shiftTypes : [];
    state.shifts = (data.shifts && typeof data.shifts === 'object') ? data.shifts : {};
    state.notes = (data.notes && typeof data.notes === 'object') ? data.notes : {};
    state.settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
    await Promise.all([
      DB.saveShiftTypes(state.shiftTypes),
      DB.saveShifts(state.shifts),
      DB.saveNotes(state.notes),
      DB.saveSettings(state.settings)
    ]);
    applyTheme();
    applyLanguageArrays();
    applyStaticLabels();
    closeModal();
    renderApp();
    showToast(tr('toast_backup_imported'));
  }catch(e){
    console.error('Backup import failed', e);
    showToast(tr('toast_backup_import_failed'));
  }
  input.value = '';
}

/* ================= Toast ================= */
let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(()=>t.remove(), 2200);
}

(function setupViewportHeightFix(){
  function setVH(){
    const h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', function(){ setTimeout(setVH, 150); setTimeout(setVH, 500); });
  window.addEventListener('load', function(){ setVH(); setTimeout(setVH, 300); });
  window.addEventListener('pageshow', setVH);
  if(document.readyState === 'complete'){ setTimeout(setVH, 50); }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setVH);
    window.visualViewport.addEventListener('scroll', setVH);
  }
  let ticks = 0;
  const iv = setInterval(function(){
    setVH();
    ticks++;
    if(ticks > 10) clearInterval(iv);
  }, 250);
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Turno Plan · Shift Planner</title>
<meta name="theme-color" content="#14161F">
<script>
(function(){
  var h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
})();
</script>
<link rel="icon" id="faviconLink" type="image/png">
<link rel="apple-touch-icon" id="appleTouchIconLink">

<!-- GoatCounter Analytics Script -->
<script data-goatcounter="https://nuriagarcia.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F3; --bg-elevated:#FFFFFF; --bg-sunken:#EFEEE7;
  --text:#14161F; --text-muted:#6B6D7A; --border:#E4E3DC;
  --accent:#6C5CE7; --accent-text:#FFFFFF;
  --danger:#E5484D;
  --note-bg: rgba(255,171,0,0.16); --note-text:#8A5A00; --note-border: rgba(255,171,0,0.32);
  --shadow: 0 8px 24px rgba(20,22,31,0.08), 0 2px 6px rgba(20,22,31,0.06);
  --shadow-lg: 0 20px 50px rgba(20,22,31,0.20), 0 6px 16px rgba(20,22,31,0.10);
  --glass: rgba(255,255,255,0.6);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:18px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
html.dark{
  --bg:#14161F; --bg-elevated:#1D2030; --bg-sunken:#191B27;
  --text:#F5F5F2; --text-muted:#9B9DB0; --border:#2B2E42;
  --accent:#9C90FF; --accent-text:#14161F;
  --note-bg: rgba(255,209,102,0.16); --note-text:#FFD166; --note-border: rgba(255,209,102,0.3);
  --shadow: 0 8px 24px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35);
  --glass: rgba(29,32,48,0.55);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; height:calc(var(--vh, 1vh) * 100); overflow:hidden;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none; transition:background .25s ease, color .25s ease;
  position:fixed; inset:0; width:100%;
}
h1,h2,h3,.display{font-family:var(--font-display); letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; background:var(--bg-sunken); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:calc(15px * var(--fs-mult, 1)); outline:none; width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);}
textarea{resize:vertical; min-height:64px;}
#app{max-width:560px; margin:0 auto; height:100%; height:calc(var(--vh, 1vh) * 100); display:flex; flex-direction:column; position:relative; overflow:hidden;}

/* ---------- Header ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  padding:calc(6px + var(--safe-top)) 12px 6px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.brand{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.brand-mark{width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg, #9C90FF, var(--accent)); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow);}
.brand h1{font-size:calc(15px * var(--fs-mult, 1)); margin:0; font-weight:700;}
.icon-btn{width:30px; height:30px; border-radius:9px; border:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; color:var(--text); transition:transform .15s ease, background .15s ease; flex-shrink:0; position:relative;}
.icon-btn:active{transform:scale(0.92);}
.icon-btn svg{width:15px; height:15px;}
.icon-btn.accent{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 35%, var(--border));}
.header-actions{display:flex; gap:5px; overflow-x:auto; scrollbar-width:none;}
.header-actions::-webkit-scrollbar{display:none;}

/* ---------- Nav / view swap ---------- */
main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:16px 16px 20px; animation:fadein .28s ease;}
main.fullbleed{display:flex; flex-direction:column; min-height:0; overflow:hidden; padding:3px 5px 5px;}
main.fullbleed > .dateflip{flex:0 0 auto; margin-bottom:5px;}
main.fullbleed > .dateflip .icon-btn{width:26px; height:26px;}
main.fullbleed > .dateflip .icon-btn svg{width:13px; height:13px;}
main.fullbleed > .paint-bar{flex:0 0 auto;}
main.fullbleed > .legend{flex:0 0 auto; margin-top:5px; max-height:64px; overflow-y:auto;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.bottomnav{
  flex:0 0 auto; position:relative; z-index:30;
  background:color-mix(in srgb, var(--bg-elevated) 92%, transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border); padding:3px 8px calc(3px + var(--safe-bottom));
  display:grid; grid-template-columns:repeat(5,1fr); gap:2px;
}
.navbtn{display:flex; flex-direction:column; align-items:center; gap:2px; padding:3px 2px; border:none; background:transparent; border-radius:10px; color:var(--text-muted); font-size:calc(9.5px * var(--fs-mult, 1)); font-weight:600; transition:color .15s ease, background .15s ease;}
.navbtn svg{width:18px; height:18px; transition:transform .15s ease;}
.navbtn.active{color:var(--accent);}
.navbtn.active svg{transform:translateY(-1px);}
.navbtn.active .navdot{opacity:1; transform:scale(1);}
.navbtn.navbtn-add.active{color:var(--accent);}
.navdot{width:4px; height:4px; border-radius:50%; background:var(--accent); opacity:0; transform:scale(0); transition:.15s ease;}
.navbtn:active{transform:scale(.93);}

/* ---------- Cards / shared ---------- */
.card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.card.flat{box-shadow:none;}
.section-title{font-size:calc(12px * var(--fs-mult, 1)); text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); font-weight:700; margin:22px 2px 10px; display:flex; align-items:center; justify-content:space-between;}
.section-title:first-child{margin-top:0;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.pillbtn{border:1px solid var(--border); background:var(--bg-elevated); border-radius:999px; padding:7px 13px; font-size:calc(13px * var(--fs-mult, 1)); font-weight:600; color:var(--text); display:flex; align-items:center; gap:6px;}
.pillbtn:active{transform:scale(.95);}
.pillbtn svg{width:15px; height:15px;}
.chip{border-radius:12px; padding:10px 12px; font-size:calc(13px * var(--fs-mult, 1)); font-weight:700; display:flex; align-items:center; gap:7px; border:2px solid transparent;}
.chip svg{width:16px; height:16px;}
.big-num{font-family:var(--font-mono); font-weight:700; font-size:calc(26px * var(--fs-mult, 1));}
.text-muted{color:var(--text-muted);}
.empty-state{text-align:center; padding:36px 16px; color:var(--text-muted);}
.empty-state svg{width:42px; height:42px; margin-bottom:12px; opacity:.5;}
.empty-state .title{font-weight:700; font-size:calc(15px * var(--fs-mult, 1)); color:var(--text); margin-bottom:4px;}

/* ---------- Day view (agenda, compact) ---------- */
.dateflip{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px;}
.day-pullback-hint{display:flex; align-items:center; justify-content:center; width:36px; height:20px; margin:0 auto 4px; color:var(--text-muted); opacity:.55; cursor:pointer;}
.day-pullback-hint svg{width:18px; height:18px;}
.dateflip .today-label{font-size:calc(13px * var(--fs-mult, 1)); color:var(--text-muted); font-weight:600;}
.dateflip .date-heading{font-size:calc(22px * var(--fs-mult, 1)); font-weight:700; margin:1px 0 0;}
.agenda-list{display:flex; flex-direction:column; gap:10px;}
.agenda-item{display:flex; align-items:flex-start; gap:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:13px 14px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:box-shadow .15s ease, transform .15s ease;}
.agenda-item::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--stripe,var(--accent));}
.agenda-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:4px;}
.agenda-icon svg{width:19px; height:19px;}
.agenda-body{flex:1; min-width:0;}
.agenda-title-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.agenda-name{font-weight:700; font-size:calc(14.5px * var(--fs-mult, 1));}
.agenda-time{font-family:var(--font-mono); font-size:calc(12px * var(--fs-mult, 1)); color:var(--text-muted); margin-top:2px;}
.agenda-notes{font-size:calc(13px * var(--fs-mult, 1)); color:var(--text-muted); margin-top:6px; line-height:1.4;}
.agenda-actions{display:flex; gap:4px; flex-shrink:0;}
.agenda-actions button{width:30px; height:30px; border-radius:99px; border:none; background:var(--bg-sunken); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.agenda-actions button svg{width:14px; height:14px;}
.agenda-actions button:active{transform:scale(.9);}
.add-shift-row{display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--border); border-radius:14px; padding:13px; color:var(--text-muted); font-weight:600; font-size:calc(13.5px * var(--fs-mult, 1)); margin-top:2px; background:transparent; transition:border-color .15s ease, color .15s ease, background .15s ease;}
.add-shift-row svg{width:16px; height:16px;}
.add-shift-row:active{transform:scale(.98);}
.add-shift-row:hover{border-color:var(--accent); color:var(--accent);}
.quickadd-row{display:flex; gap:8px; margin-top:12px;}
.quickadd-row .add-shift-row{flex:1; margin-top:0;}
.agenda-item.note-item::before{background:var(--text-muted);}
.agenda-item.note-item .agenda-icon{background:var(--bg-sunken); color:var(--text-muted);}
.agenda-item.note-item .agenda-name{color:var(--text-muted); font-size:calc(11px * var(--fs-mult, 1)); text-transform:uppercase; letter-spacing:.06em;}
.agenda-item.note-item .agenda-notes{color:var(--text); font-size:calc(14px * var(--fs-mult, 1)); margin-top:3px;}

/* ---------- Hourly timeline (Day view) ---------- */
.timeline-wrap{position:relative; border-radius:16px; background:var(--bg-elevated); border:1px solid var(--border); box-shadow:var(--shadow); overflow:hidden; margin-top:2px;}
.timeline-hours{position:absolute; inset:0;}
.hour-row{height:56px; border-top:1px solid var(--border); position:relative;}
.hour-row:first-child{border-top:none;}
.hour-label{position:absolute; left:10px; top:-7px; font-size:calc(10px * var(--fs-mult, 1)); font-weight:600; color:var(--text-muted); font-family:var(--font-mono); background:var(--bg-elevated); padding:0 4px; z-index:1;}
.hour-row:first-child .hour-label{top:2px;}
.timeline-events{position:absolute; top:0; left:56px; right:8px; bottom:0;}
.timeline-event{position:absolute; left:0; right:0; border-radius:10px; padding:6px 10px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; z-index:2;}
.timeline-event:active{transform:scale(.97);}
.te-name{font-weight:700; font-size:calc(12.5px * var(--fs-mult, 1)); line-height:1.25;}
.te-time{font-family:var(--font-mono); font-size:calc(10.5px * var(--fs-mult, 1)); opacity:.85; margin-top:1px;}
.te-notes{font-size:calc(10.5px * var(--fs-mult, 1)); opacity:.85; margin-top:3px; line-height:1.35;}
.timeline-event.note-event{background:var(--bg-sunken); color:var(--text); border:1.5px dashed var(--text-muted); box-shadow:none;}
.timeline-event.note-event .te-name{display:flex; align-items:center; gap:6px; color:var(--text-muted); text-transform:uppercase; font-size:calc(11.5px * var(--fs-mult, 1)); letter-spacing:.04em;}
.timeline-event.note-event .te-name svg{width:13px; height:13px; flex-shrink:0;}
.timeline-event.note-event .te-notes{color:var(--text); opacity:1; font-size:calc(13px * var(--fs-mult, 1)); font-weight:500; margin-top:4px;}
.note-time-row{display:flex; align-items:center; gap:8px;}
.note-time-row input[type="time"]{flex:1;}
.note-time-row .clear-time-btn{flex-shrink:0; width:38px; height:38px; border-radius:12px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.note-time-row .clear-time-btn:active{transform:scale(.92);}
.note-time-row .clear-time-btn svg{width:15px; height:15px;}
.agenda-item.note-item .agenda-time{color:var(--text-muted);}
.now-line{position:absolute; left:0; right:0; height:0; border-top:2px solid var(--danger); z-index:3; pointer-events:none;}
.now-line span{position:absolute; left:-4px; top:-4.5px; width:9px; height:9px; border-radius:50%; background:var(--danger); box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent);}

/* ---------- Month grid ---------- */
.month-grid-head{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; margin-bottom:2px; flex:0 0 auto;}
.month-grid-head div{text-align:center; font-size:calc(8.5px * var(--fs-mult, 1)); font-weight:700; color:var(--text-muted);}
.month-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; flex:1 1 auto; min-height:0;}
.day-cell{width:100%; height:100%; min-width:0; min-height:0; border-radius:10px; background:var(--bg-elevated); border:1.25px solid color-mix(in srgb, var(--accent) 28%, var(--border)); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px 2px; gap:1px; position:relative; font-weight:700; font-size:calc(10.5px * var(--fs-mult, 1)); overflow:hidden;}
.day-cell{transition:transform .1s ease, box-shadow .15s ease;}
.day-cell:active{transform:scale(.93);}
.day-cell.outside{opacity:.25;}
.day-cell.today{outline:2px solid var(--accent); outline-offset:-2px; background:color-mix(in srgb, var(--accent) 10%, var(--bg-elevated));}
.day-cell .dnum{position:absolute; top:2px; left:4px; line-height:1; font-size:calc(9.5px * var(--fs-mult, 1)); font-weight:700; transition:font-size .1s ease; color:#000; z-index:1;}
html.dark .day-cell .dnum{color:#fff;}
.day-cell.painted .dnum{background:rgba(255,255,255,.55); color:#14161F; padding:1px 6px; border-radius:7px; box-shadow:0 1px 3px rgba(0,0,0,.15);}
.day-cell .dtype{position:absolute; bottom:2px; left:50%; transform:translateX(-50%); line-height:1; font-size:calc(7.5px * var(--fs-mult, 1)); font-weight:800; letter-spacing:.3px; z-index:1; background:rgba(255,255,255,.55); color:#14161F; padding:1px 5px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.15); max-width:calc(100% - 6px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.day-dots{display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; justify-content:center; max-width:100%;}
.day-dots span{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.day-dots span.note-dot{border-radius:2px; background:var(--text-muted);}
.day-notes-wrap{display:flex; flex-direction:column; align-items:center; gap:1px; max-width:100%; min-height:0; overflow:hidden;}
.day-note-badge{font-weight:600; color:var(--text-muted); background:var(--bg-sunken); border-radius:5px; padding:1px 4px; max-width:100%; overflow:hidden; line-height:1.2; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; word-break:break-word; text-align:center;}
.day-cell.painted .day-note-badge{background:rgba(255,255,255,.32); color:#fff;}
.day-cell.painted.note-on-light .day-note-badge{background:rgba(0,0,0,.14); color:#14161F;}
.day-cell.painted{border-color:color-mix(in srgb, #000 18%, transparent);}
.day-cell.painted.today{outline-color:#fff;}
.day-cell.painted.note-on-light.today{outline-color:#14161F;}
.day-cell.painted .day-dots span.note-dot{background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.3);}
.day-cell.painted.note-on-light .day-dots span.note-dot{background:#14161F; box-shadow:0 0 0 1px rgba(255,255,255,.4);}
.day-cell.multi-shift{background:color-mix(in srgb, var(--text-muted) 9%, var(--bg-elevated));}
.color-strip{position:absolute; left:7px; right:7px; bottom:6px; height:5px; border-radius:3px; overflow:hidden; display:flex; gap:1.5px; box-shadow:0 1px 2px rgba(0,0,0,.12);}
.color-strip span{flex:1 1 0; height:100%;}

/* ---------- Week view ---------- */
.week-list{display:flex; flex-direction:column; gap:10px;}
.week-day-row{display:flex; align-items:stretch; gap:12px; width:100%; text-align:left; background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:12px 13px; box-shadow:var(--shadow); color:var(--text); transition:transform .1s ease;}
.week-day-row:active{transform:scale(.98);}
.week-day-row.today{outline:2px solid var(--accent); outline-offset:-2px; background:color-mix(in srgb, var(--accent) 8%, var(--bg-elevated));}
.week-day-date{display:flex; flex-direction:column; align-items:center; justify-content:center; width:44px; flex-shrink:0; border-right:1px solid var(--border); padding-right:12px;}
.week-day-date .wd-dow{font-size:calc(10px * var(--fs-mult, 1)); font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;}
.week-day-date .wd-num{font-size:calc(21px * var(--fs-mult, 1)); font-weight:700; font-family:var(--font-display); margin-top:2px; line-height:1;}
.week-day-row.today .wd-num, .week-day-row.today .wd-dow{color:var(--accent);}
.week-day-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; justify-content:center;}
.week-chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.week-chip{display:inline-flex; align-items:center; gap:5px; border-radius:8px; padding:4px 8px; font-size:calc(11px * var(--fs-mult, 1)); font-weight:700; max-width:100%; overflow:hidden;}
.week-chip svg{width:12px; height:12px; flex-shrink:0;}
.week-chip span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.week-chip .wc-time{opacity:.85; font-family:var(--font-mono); font-weight:600;}
.week-note-chip{display:inline-flex; align-items:center; gap:5px; border-radius:8px; padding:4px 9px; font-size:calc(11.5px * var(--fs-mult, 1)); font-weight:600; background:var(--note-bg); color:var(--note-text); border:1px solid var(--note-border);}
.week-empty{font-size:calc(12.5px * var(--fs-mult, 1)); color:var(--text-muted);}
.week-hours{font-size:calc(11px * var(--fs-mult, 1)); color:var(--text-muted); font-family:var(--font-mono); font-weight:600; flex-shrink:0; align-self:center; padding-left:4px;}

/* ---------- Year view ---------- */
.year-month{margin-bottom:20px;}
.year-month h3{font-size:calc(14px * var(--fs-mult, 1)); margin:0 0 8px 2px; font-weight:700;}
.year-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px;}
.year-cell{aspect-ratio:1/1; width:100%; min-width:0; margin:0; border-radius:7px; background:var(--bg-sunken); display:flex; align-items:center; justify-content:center; padding:0; border:1px solid color-mix(in srgb, var(--accent) 22%, transparent); font-family:var(--font-mono); font-size:calc(10px * var(--fs-mult, 1)); font-weight:700; color:#000; line-height:1; -webkit-appearance:none; appearance:none; position:relative; overflow:hidden;}
html.dark .year-cell{color:#fff;}
.year-cell.multi-shift{background:color-mix(in srgb, var(--text-muted) 12%, var(--bg-sunken));}
.year-cell .mini-strip{position:absolute; left:2px; right:2px; bottom:2px; height:2.5px; border-radius:2px; overflow:hidden; display:flex; gap:1px;}
.year-cell .mini-strip span{flex:1 1 0; height:100%;}
.year-cell.outside{opacity:0; pointer-events:none;}
.year-cell.today{outline:1.5px solid var(--accent); outline-offset:-1.5px;}

/* ---------- Modals / sheets ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,10,16,.5); backdrop-filter:blur(2px); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fadein .2s ease;}
.sheet-wrap{position:relative; width:100%; max-width:560px; display:flex; justify-content:center;}
.sheet{width:100%; background:var(--bg); border-radius:24px 24px 0 0; padding:10px 18px calc(22px + var(--safe-bottom)); max-height:90vh; max-height:90svh; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; animation:sheetup .25s cubic-bezier(.2,.9,.3,1); touch-action:pan-y;
  background-image:
    linear-gradient(var(--bg), var(--bg)),
    linear-gradient(var(--bg), var(--bg)),
    linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,0)),
    linear-gradient(to top, rgba(0,0,0,.14), rgba(0,0,0,0));
  background-position: top, bottom, top, bottom;
  background-repeat: no-repeat;
  background-size: 100% 24px, 100% 32px, 100% 14px, 100% 20px;
  background-attachment: local, local, scroll, scroll;
}
body.modal-open{overflow:hidden;}
html.modal-open{overflow:hidden;}
@keyframes sheetup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:5px; background:var(--border); border-radius:99px; margin:6px auto 14px; cursor:grab; touch-action:none; position:relative;}
.sheet-handle::before{content:''; position:absolute; inset:-16px -24px;}
.sheet-handle:active{cursor:grabbing;}
.sheet-close{position:absolute; top:-50px; right:14px; z-index:10; width:36px; height:36px; border-radius:50%; background:var(--bg-elevated); box-shadow:var(--shadow); border:1px solid var(--border); color:var(--text); display:flex; align-items:center; justify-content:center;}
.sheet-close svg{width:16px; height:16px;}
.sheet-close:active{transform:scale(.9);}
.sheet h2{font-size:calc(20px * var(--fs-mult, 1)); margin:0 0 14px; display:flex; align-items:center; justify-content:space-between;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:calc(12px * var(--fs-mult, 1)); font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field-hint{font-size:calc(12px * var(--fs-mult, 1)); color:var(--text-muted); margin-top:6px; line-height:1.4;}
.type-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.type-chip{border-radius:14px; padding:12px 6px; text-align:center; border:2px solid var(--border); background:var(--bg-elevated); font-weight:700; font-size:calc(12.5px * var(--fs-mult, 1)); display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--text); transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;}
.type-chip svg{width:18px; height:18px;}
.type-chip.selected{border-color:currentColor; box-shadow:var(--shadow); background:color-mix(in srgb, currentColor 10%, var(--bg-elevated));}
.type-chip:active{transform:scale(.96);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.checkbox-row{display:flex; align-items:center; gap:10px; background:var(--bg-sunken); border-radius:12px; padding:12px 14px;}
.checkbox-row input{width:20px; height:20px; padding:0; flex-shrink:0; accent-color:var(--accent);}
.checkbox-row label{margin:0; font-size:calc(13.5px * var(--fs-mult, 1)); font-weight:600; text-transform:none; letter-spacing:0; color:var(--text);}
.month-pick-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.month-pick-btn{border-radius:14px; padding:14px 6px; text-align:center; border:2px solid var(--border); background:var(--bg-elevated); font-weight:700; font-size:calc(13.5px * var(--fs-mult, 1)); color:var(--text); transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;}
.month-pick-btn:active{transform:scale(.96);}
.month-pick-btn.is-today{color:var(--accent);}
.month-pick-btn.selected{border-color:var(--accent); box-shadow:var(--shadow); background:color-mix(in srgb, var(--accent) 12%, var(--bg-elevated));}

/* ---------- Day picker (day view) ---------- */
.day-pick-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; margin-top:2px;}
.day-pick-cell{aspect-ratio:1; border-radius:12px; border:2px solid transparent; background:var(--bg-sunken); font-weight:700; font-size:calc(13px * var(--fs-mult, 1)); color:var(--text); display:flex; align-items:center; justify-content:center; transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;}
.day-pick-cell:active{transform:scale(.9);}
.day-pick-cell.outside{opacity:.3;}
.day-pick-cell.is-today{color:var(--accent);}
.day-pick-cell.selected{border-color:var(--accent); box-shadow:var(--shadow); background:color-mix(in srgb, var(--accent) 14%, var(--bg-elevated));}

/* ---------- Week picker (week view) ---------- */
.week-pick-grid{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
.week-pick-row{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; border-radius:14px; border:2px solid transparent; background:transparent; padding:4px; transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;}
.week-pick-row:active{transform:scale(.98);}
.week-pick-row.selected{border-color:var(--accent); box-shadow:var(--shadow); background:color-mix(in srgb, var(--accent) 10%, var(--bg-elevated));}
.week-pick-cell{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:calc(13px * var(--fs-mult, 1)); color:var(--text); background:var(--bg-sunken);}
.week-pick-cell.outside{opacity:.3;}
.week-pick-cell.is-today{color:var(--accent);}
.palette-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:10px;}
.palette-swatch{aspect-ratio:1/1; width:100%; border-radius:50%; border:none; padding:0; position:relative; box-shadow:var(--shadow);}
.palette-swatch.selected::after{content:''; position:absolute; inset:-4px; border:2px solid var(--text); border-radius:50%;}
.palette-swatch:active{transform:scale(.92);}
.swatch-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.swatch{aspect-ratio:1/1; border-radius:10px; border:2px solid transparent; position:relative;}
.swatch.selected{border-color:var(--text);}
.swatch.selected::after{content:''; position:absolute; inset:0; border:2px solid var(--bg-elevated); border-radius:8px;}
.icon-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.icon-opt{aspect-ratio:1/1; border-radius:10px; border:1.5px solid var(--border); background:var(--bg-sunken); display:flex; align-items:center; justify-content:center; color:var(--text);}
.icon-opt svg{width:17px; height:17px;}
.icon-opt.selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--bg-sunken)); color:var(--accent);}
.btn{width:100%; padding:14px; border-radius:14px; border:none; font-weight:700; font-size:calc(15px * var(--fs-mult, 1)); display:flex; align-items:center; justify-content:center; gap:8px;}
.btn svg{width:18px; height:18px; flex-shrink:0;}
.btn-primary{background:var(--accent); color:var(--accent-text);}
.btn-primary:active{transform:scale(.98);}
.btn-ghost{background:var(--bg-sunken); color:var(--text);}
.btn-danger{background:transparent; color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent);}
.btn:disabled{opacity:.5;}
.btn-row{display:flex; gap:10px; margin-top:6px;}
.btn-row .btn{flex:1;}
.dashline{border:none; border-top:1px dashed var(--border); margin:16px 0;}

/* ---------- Shift Types Manager ---------- */
.shifttype-row{display:flex; align-items:center; gap:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:12px 13px; margin-bottom:10px; box-shadow:var(--shadow);}
.shifttype-swatch{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.shifttype-swatch svg{width:19px; height:19px;}
.shifttype-info{flex:1; min-width:0;}
.shifttype-name{font-weight:700; font-size:calc(14.5px * var(--fs-mult, 1));}
.shifttype-meta{font-size:calc(12px * var(--fs-mult, 1)); color:var(--text-muted); font-family:var(--font-mono); margin-top:2px;}
.shifttype-actions{display:flex; gap:4px;}
.shifttype-actions button{width:32px; height:32px; border-radius:99px; border:none; background:var(--bg-sunken); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.shifttype-actions button svg{width:15px; height:15px;}
.shifttype-actions button:active{transform:scale(.9);}

/* ---------- Calendar style picker ---------- */
.cal-style-option{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--bg-elevated); border:1.5px solid var(--border); border-radius:16px; padding:14px; transition:border-color .15s ease, transform .1s ease;}
.cal-style-option:active{transform:scale(.98);}
.cal-style-option:hover{border-color:var(--accent);}
.cal-style-preview.single{flex-shrink:0;}
.csp-cell{background:var(--bg-sunken); border-radius:99px; padding:6px; width:52px; height:52px; position:relative; display:flex; flex-direction:column; gap:3px; box-sizing:border-box;}
.csp-cell.painted{opacity:.92;}
.csp-num{font-size:11px; font-weight:700; color:var(--text);}
.csp-cell.painted .csp-num{color:#14161F;}
.csp-bar{height:6px; border-radius:3px;}
.csp-bar.muted{background:var(--border);}
.cso-text{flex:1; min-width:0;}
.cso-label{font-weight:700; font-size:calc(14.5px * var(--fs-mult, 1));}
.cso-desc{font-size:calc(12px * var(--fs-mult, 1)); color:var(--text-muted); margin-top:2px; line-height:1.4;}

/* ---------- Month view: event-bars style ---------- */
.day-cell-bars{width:100%; height:100%; min-width:0; min-height:0; border-radius:12px; background:var(--bg-elevated); border:1px solid var(--border); display:flex; flex-direction:column; align-items:stretch; padding:4px 3px; gap:2px; position:relative; overflow:hidden; transition:transform .1s ease;}
.day-cell-bars:active{transform:scale(.96);}
.day-cell-bars.outside{opacity:.32;}
.day-cell-bars.today{outline:2px solid var(--accent); outline-offset:-2px;}
.dnum-bars{font-size:calc(10.5px * var(--fs-mult, 1)); font-weight:700; color:var(--text); text-align:left; flex-shrink:0;}
.day-cell-bars.outside .dnum-bars{color:var(--text-muted);}
.event-bars-wrap{display:flex; flex-direction:column; gap:2px; overflow:hidden; flex:1; min-height:0;}
.event-bar{border-radius:4px; padding:1px 4px; font-size:calc(8px * var(--fs-mult, 1)); font-weight:700; line-height:1.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0;}
.event-bar.note-bar{background:var(--bg-sunken); color:var(--text-muted); font-weight:600;}
.event-bar-more{font-size:calc(7.5px * var(--fs-mult, 1)); color:var(--text-muted); font-weight:700; padding:0 3px; flex-shrink:0;}

/* ---------- Metrics ---------- */
.modeToggle{display:flex; background:var(--bg-sunken); border-radius:12px; padding:3px; margin-bottom:16px;}
.modeToggle button{flex:1; border:none; background:transparent; padding:9px; border-radius:9px; font-weight:700; font-size:calc(13px * var(--fs-mult, 1)); color:var(--text-muted);}
.modeToggle button.active{background:var(--bg-elevated); color:var(--text); box-shadow:var(--shadow);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.stat-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); opacity:.55;}
.stat-card .lab{font-size:calc(11px * var(--fs-mult, 1)); text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700; margin-bottom:6px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-key{width:96px; font-size:calc(12.5px * var(--fs-mult, 1)); font-weight:700; color:var(--text-muted); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{flex:1; height:10px; border-radius:6px; background:var(--bg-sunken); overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.bar-val{width:52px; text-align:right; font-family:var(--font-mono); font-size:calc(12.5px * var(--fs-mult, 1)); font-weight:600; flex-shrink:0;}

.toast{position:fixed; left:50%; bottom:calc(100px + var(--safe-bottom)); transform:translateX(-50%); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:calc(13.5px * var(--fs-mult, 1)); font-weight:600; z-index:90; box-shadow:var(--shadow-lg); animation:toastin .2s ease; max-width:88%; text-align:center;}
@keyframes toastin{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

/* ---------- Add / composer view ---------- */
.addview .composer-datebar{display:flex; align-items:center; gap:8px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px; padding:6px 6px; box-shadow:var(--shadow); margin-bottom:10px;}
.addview .composer-datebar .icon-btn{width:32px; height:32px; border-radius:10px;}
.addview .composer-datebar .icon-btn svg{width:16px; height:16px;}
.addview .dn-mid{flex:1; text-align:center; min-width:0;}
.addview .dn-dow{font-size:calc(10.5px * var(--fs-mult, 1)); font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}
.addview .dn-date{font-size:calc(15px * var(--fs-mult, 1)); font-weight:700; margin-top:1px;}
.addview .today-jump{font-size:calc(10.5px * var(--fs-mult, 1)); font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); border:none; border-radius:999px; padding:2px 8px; margin-top:2px;}
.addview .modeToggle{margin-bottom:16px;}
.addview .modeToggle button{display:flex; align-items:center; justify-content:center; gap:6px;}
.addview .modeToggle button svg{width:15px; height:15px;}
.addview .field{margin-bottom:12px;}
.addview .field label{margin-bottom:5px;}
.addview .type-grid{grid-template-columns:repeat(3,1fr); gap:6px;}
.addview .type-chip{padding:9px 4px; font-size:calc(11.5px * var(--fs-mult, 1)); gap:3px; border-radius:12px;}
.addview .type-chip svg{width:15px; height:15px;}
.addview textarea{min-height:52px; font-size:calc(14px * var(--fs-mult, 1)); padding:9px 11px;}
.addview .section-title{margin:18px 2px 8px;}
.addview .btn{padding:12px;}

.notelist{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.note-mini{display:flex; align-items:flex-start; gap:10px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px; padding:11px 12px;}
.note-mini p{flex:1; min-width:0; margin:0; font-size:calc(13.5px * var(--fs-mult, 1)); line-height:1.45; color:var(--text);}
.note-mini .note-mini-actions{display:flex; gap:4px; flex-shrink:0;}
.note-mini .note-mini-actions button{width:26px; height:26px; border-radius:8px; border:none; background:var(--bg-sunken); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.note-mini .note-mini-actions button svg{width:13px; height:13px;}
.editing-banner{display:flex; align-items:center; justify-content:space-between; gap:8px; background:color-mix(in srgb, var(--accent) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); color:var(--accent); border-radius:12px; padding:8px 12px; font-size:calc(12px * var(--fs-mult, 1)); font-weight:700; margin-bottom:12px;}
.editing-banner button{background:none; border:none; color:var(--accent); font-weight:700; font-size:calc(11.5px * var(--fs-mult, 1)); text-decoration:underline;}

.legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:14px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:calc(12px * var(--fs-mult, 1)); font-weight:600; color:var(--text-muted);}

/* ---------- Paint bar (Month view) ---------- */
.paint-bar{flex:0 0 auto; margin-top:2px;}
.paint-bar-row{display:flex; justify-content:flex-end; align-items:center;}
.paint-bar-row.is-active{justify-content:space-between;}
.paint-toggle{display:flex; align-items:center; gap:3px; padding:3px 7px; border:none; background:transparent; color:var(--text-muted); font-weight:600; font-size:calc(9.5px * var(--fs-mult, 1)); border-radius:99px; opacity:.7;}
.paint-toggle svg{width:13px; height:13px;}
.paint-status{display:flex; align-items:center; gap:5px; padding:5px 10px; color:var(--accent); font-weight:600; font-size:calc(11.5px * var(--fs-mult, 1)); border-radius:99px; background:color-mix(in srgb, var(--accent) 10%, transparent);}
.paint-status svg{width:13px; height:13px;}
.paint-bar.active .paint-toggle{color:var(--accent); opacity:1; background:color-mix(in srgb, var(--accent) 10%, transparent);}
.paint-strip{display:flex; flex-direction:column; gap:6px; padding:8px 2px 2px; margin-top:2px; border-top:1px solid var(--border); max-height:30vh; overflow-y:auto;}
.paint-hint{font-size:calc(11px * var(--fs-mult, 1)); color:var(--text-muted); text-align:center; padding:0 6px; flex:0 0 auto;}
.paint-chip-row{display:flex; flex-wrap:wrap; gap:5px; padding:2px; justify-content:center; flex:0 0 auto;}
.paint-chip{flex:0 0 auto; display:flex; align-items:center; gap:4px; border-radius:99px; padding:5px 8px; font-size:calc(10.5px * var(--fs-mult, 1)); font-weight:600; border:1.5px solid transparent; background:var(--bg-sunken); color:var(--text); white-space:nowrap;}
.paint-chip svg{width:12px; height:12px;}
.paint-chip.selected{border-color:currentColor; box-shadow:var(--shadow);}
.paint-chip:active{transform:scale(.95);}
.legend-dot{width:9px; height:9px; border-radius:3px;}

::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" style="background:none; box-shadow:none;">
        <img id="brandIconImg" alt="" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <h1 id="appNameHeading">Turno Plan</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="metricsHdrBtn" onclick="setTab('metrics')" aria-label="Metrics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      </button>
      <button class="icon-btn" onclick="openShiftTypesManager()" aria-label="Manage shift types">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme"></button>
    </div>
  </header>

  <main id="view-root"></main>

  <nav class="bottomnav">
    <button class="navbtn" data-tab="list" onclick="setTab('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span class="navlabel" data-i18n="nav_list">List</span><span class="navdot"></span>
    </button>
    <button class="navbtn" data-tab="day" onclick="setTab('day', {resetToToday:true})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M12 13v4M10 15h4"/></svg>
      <span class="navlabel" data-i18n="nav_day">Day</span><span class="navdot"></span>
    </button>
    <button class="navbtn" data-tab="week" onclick="setTab('week')">

  var t = setInterval(function() {
    if (window.goatcounter && typeof window.goatcounter.count === 'function') {
      clearInterval(t);
      window.goatcounter.count({
        path: path,
        title: title || path,

      });
    }
  }, 100);
  setTimeout(function() { clearInterval(t); }, 3000);
}

(function setupModalScrollLock(){
  var modalRoot = document.getElementById('modal-root');
  if(!modalRoot) return;
  var mo = new MutationObserver(function(){
    var open = modalRoot.childElementCount > 0;
    document.documentElement.classList.toggle('modal-open', open);
    document.body.classList.toggle('modal-open', open);
  });
  mo.observe(modalRoot, { childList: true });
})();

const SWATCHES = ['#6C5CE7','#FFA94D','#FF6B4A','#2DD4BF','#52B788','#FF5C8A','#4D96FF','#FFD93D','#E5484D','#8890A6','#5B5FEF','#22D3EE'];
function textColorFor(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const yiq = (r*299 + g*587 + b*114) / 1000;
  return yiq >= 128 ? '#14161F' : '#FFFFFF';
}

/* ---------------- Date utils ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromDateStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function todayStr(){ return toDateStr(new Date()); }
function mondayIndex(d){ return (d.getDay()+6)%7; }
function timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtHuman(dateStr){
  const d = fromDateStr(dateStr);
  return WEEKDAYS_FULL[mondayIndex(d)]+', '+MONTHS[d.getMonth()]+' '+d.getDate();
}
function fmtHumanShort(dateStr){
  const d = fromDateStr(dateStr);
  return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate();
}
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function escapeHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function shiftDurationHours(type){
  if(!type || !type.isWork || !type.start || !type.end) return 0;
  let start = timeToMin(type.start), end = timeToMin(type.end);
  let mins = end - start;
  if(mins <= 0) mins += 1440;
  const brk = Number(type.breakMins)||0;
  return Math.max(0,(mins - brk))/60;
}

function detectDeviceLanguage(){
  const candidates = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for(const c of candidates){
    if(/^es/i.test(c)) return 'es';
  }
  return 'en';
}
const DB = {
  hasArtifactStorage(){ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; },
  lsGet(key){
    try{ const raw = localStorage.getItem('rota:'+key); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  },
  lsSet(key, value){
    try{ localStorage.setItem('rota:'+key, JSON.stringify(value)); }
    catch(e){ console.error('localStorage save failed', e); }
  },
  async _load(key, emptyValue){
    const local = this.lsGet(key);
    if(local !== null){
      if(this.hasArtifactStorage()){
        try{ window.storage.set(key, JSON.stringify(local), false).catch(()=>{}); } catch(e){ }
      }
      return local;
    }
    if(this.hasArtifactStorage()){
      try{
        const r = await window.storage.get(key, false);
        const remote = r ? JSON.parse(r.value) : null;
        if(remote !== null){ this.lsSet(key, remote); return remote; }
      }catch(e){ }
    }
    return emptyValue;
  },
  async _save(key, value){
    this.lsSet(key, value);
    if(this.hasArtifactStorage()){
      try{ await window.storage.set(key, JSON.stringify(value), false); }
      catch(e){ console.error('save '+key+' failed (artifact storage)', e); }
    }
  },
  async loadShiftTypes(){ return this._load('shiftTypes', []); },
  async saveShiftTypes(arr){ return this._save('shiftTypes', arr); },
  async loadShifts(){ return this._load('shifts', {}); },
  async saveShifts(obj){ return this._save('shifts', obj); },
  async loadNotes(){ return this._load('notes', {}); },
  async saveNotes(obj){ return this._save('notes', obj); },
  async loadSettings(){
    const raw = await this._load('settings', null);
    return raw ? {...DEFAULT_SETTINGS, ...raw} : {...DEFAULT_SETTINGS};
  },
  async saveSettings(obj){ return this._save('settings', obj); }
};

function formatLeadTime(hoursFloat){
  const total = Math.max(0, Math.round((Number(hoursFloat)||0) * 60));
  const h = Math.floor(total / 60);
  const m = total % 60;
  if(h > 0 && m > 0) return `${h}h${String(m).padStart(2,'0')}`;
  if(h > 0) return `${h}h`;
  return `${m}m`;
}
function slashify(str){
  if(!str) return str;
  return str.replace(/\s*&\s*/g, '/').replace(/\s+y\s+/gi, '/').replace(/\s+and\s+/gi, '/');
}
function shiftAbbr(name){
  if(!name) return '';
  const parts = name.trim().split(/\s*(?:&|\by\b|\band\b)\s*/i).filter(Boolean);
  if(parts.length >= 2){
    return parts.map(p => (p.trim()[0] || '')).join('/').toUpperCase();
  }
  const words = name.trim().split(/\s+/).filter(Boolean);
  if(words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return name.trim().slice(0,2).toUpperCase();
}

async function init(){
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(()=>{});
  }
  const hadLocalData = ['shiftTypes','shifts','notes','settings'].some(k => DB.lsGet(k) !== null);
  const [shiftTypes, shifts, notes, settings] = await Promise.all([DB.loadShiftTypes(), DB.loadShifts(), DB.loadNotes(), DB.loadSettings()]);
  state.shiftTypes = shiftTypes;
  state.shifts = shifts;
  state.notes = notes;
  state.settings = settings;
  applyTheme();
  checkReminders();
  checkWeeklyDigest();
  if(!state.settings.language){
    state.settings.language = detectDeviceLanguage();
    DB.saveSettings(state.settings);
  }
  applyLanguageArrays();
  applyStaticLabels();
  seedDefaultShiftTypesIfNeeded();
  renderApp();
  continueOnboarding();
  const gotSomethingBack = shiftTypes.length > 0 || Object.keys(shifts).length > 0 || Object.keys(notes).length > 0;
  if(!hadLocalData && DB.hasArtifactStorage() && gotSomethingBack){
    setTimeout(()=>showToast(tr('toast_data_restored')), 700);
  }
  trackView('/month', 'Month View');
}

function acceptWeeklyDigestOnboarding(){
  state.settings.weeklyDigestAsked = true;
  if(typeof Notification === 'undefined'){
    state.settings.weeklyDigestEnabled = false;
    DB.saveSettings(state.settings);
    showToast(tr('reminders_unsupported'));
    continueOnboarding();
    return;
  }
  const grantHandler = (perm)=>{
    if(perm === 'granted'){
      state.settings.weeklyDigestEnabled = true;
      state.settings.remindersEnabled = true;
      showToast(tr('toast_weekly_digest_on'));
      checkWeeklyDigest();
    } else {
      state.settings.weeklyDigestEnabled = false;
      showToast(tr('reminders_denied'));
    }
    DB.saveSettings(state.settings);
    continueOnboarding();
  };
  if(Notification.permission === 'granted'){
    grantHandler('granted');
  } else {
    Notification.requestPermission().then(grantHandler);
  }
}

  state.settings.weeklyDigestEnabled = false;

/* ================= DAY VIEW (hourly timeline) ================= */
const HOUR_H = 56;
function renderDayView(){
  const dateStr = state.selectedDate;
  const isToday = dateStr === todayStr();
  const entries = entriesFor(dateStr);
  const dayNotes = notesFor(dateStr);

  const timedEntries = entries.filter(e=>{ const t=typeById(e.typeId); return t && t.isWork && t.start && t.end; });
  const allDayEntries = entries.filter(e=>{ const t=typeById(e.typeId); return !t || !(t.isWork && t.start && t.end); });
  const timedNotes = dayNotes.filter(n=>n.time);
  const allDayNotes = dayNotes.filter(n=>!n.time);

  let body = '';
  if(entries.length === 0 && dayNotes.length === 0){
    body = `<div class="empty-state">
      ${ICONS.calBlank}
      <div class="title">${tr('nothing_scheduled')}</div>
      <div>${tr('nothing_scheduled_sub')}</div>
    </div>`;
  } else {
    if(allDayEntries.length || allDayNotes.length){
      body += `<div class="section-title" style="margin-top:0">${tr('all_day')}</div>`;
      body += '<div class="agenda-list">'
        + allDayEntries.map(e => renderAgendaItem(e, dateStr)).join('')
        + allDayNotes.map(n => renderNoteAgendaItem(n, dateStr)).join('')
        + '</div>';
    }
    if(timedEntries.length || timedNotes.length){
      body += `<div class="section-title">${tr('timeline')}</div>`;
      body += renderTimeline(timedEntries, dateStr, timedNotes);
    } else if(allDayEntries.length || allDayNotes.length){
      body += `<div class="text-muted" style="font-size:calc(13px * var(--fs-mult, 1)); margin-top:14px">${tr('no_timed_shifts')}</div>`;
    }
  }
  body += `<div class="quickadd-row">
    <button class="add-shift-row" onclick="goAddShift()">${ICONS.plus} ${tr('add_shift')}</button>
    <button class="add-shift-row" onclick="goAddNote()">${ICONS.note} ${tr('add_note')}</button>
  </div>`;
  if(state.shiftTypes.length === 0){
    body += `<div class="card" style="margin-top:16px">
      <div style="font-weight:700;font-size:calc(14.5px * var(--fs-mult, 1));margin-bottom:6px">${tr('create_first_type_title')}</div>
      <div class="text-muted" style="font-size:calc(13px * var(--fs-mult, 1));line-height:1.5;margin-bottom:12px">${tr('create_first_type_sub')}</div>
      <button class="btn btn-primary" onclick="openShiftTypesManager()">${ICONS.layers} ${tr('manage_types')}</button>
    </div>`;
  }

  return `
    ${state.dayReturnTab ? `<div class="day-pullback-hint" onclick="goBackFromDay()" aria-label="${tr('back')}">${ICONS.chevDown}</div>` : ''}
    <div class="dateflip">
      <button class="icon-btn" onclick="shiftDay(-1)">${ICONS.chevL}</button>
      <div style="text-align:center; cursor:pointer" onclick="openDayPicker()">
        <div class="today-label">${isToday?tr('today'):WEEKDAYS_FULL[mondayIndex(fromDateStr(dateStr))]}</div>
        <h2 class="date-heading">${fmtHumanShort(dateStr)}</h2>
      </div>
      <button class="icon-btn" onclick="shiftDay(1)">${ICONS.chevR}</button>
    </div>
    ${body}
  `;
}
function renderTimeline(timedEntries, dateStr, timedNotes){
  const hourRows = [];
  for(let h=0; h<24; h++){
    hourRows.push(`<div class="hour-row"><span class="hour-label">${pad(h)}:00</span></div>`);
  }
  const events = timedEntries.map(e=>{
    const t = typeById(e.typeId);
    const startMin = timeToMin(t.start);
    let endMin = timeToMin(t.end);
    const crossesMidnight = endMin <= startMin;
    if(crossesMidnight) endMin = 24*60;
    const top = (startMin/60)*HOUR_H;
    const height = Math.max(30, ((endMin-startMin)/60)*HOUR_H - 2);
    return `<div class="timeline-event" style="top:${top}px;height:${height}px;background:${t.color};color:${textColorFor(t.color)}" onclick="openShiftModal('${dateStr}','${e.id}')">
      <div class="te-name">${escapeHtml(t.name)}${crossesMidnight?' ›':''}</div>
      <div class="te-time">${t.start}–${t.end}</div>
      ${e.notes && height>50 ? `<div class="te-notes">${escapeHtml(e.notes)}</div>` : ''}
    </div>`;
  }).join('');
  const noteEvents = (timedNotes||[]).map(n=>{
    const startMin = timeToMin(n.time);
    const top = (startMin/60)*HOUR_H;
    const height = 58;
    return `<div class="timeline-event note-event" style="top:${top}px;height:${height}px" onclick="editNoteInline('${dateStr}','${n.id}')">
      <div class="te-name">${ICONS.note}${escapeHtml(n.time)}</div>
      <div class="te-notes">${escapeHtml(n.text)}</div>
    </div>`;
  }).join('');
  const allEvents = events + noteEvents;
  let nowLine = '';
  if(dateStr === todayStr()){
    const now = new Date();
    const top = ((now.getHours()*60+now.getMinutes())/60)*HOUR_H;
    nowLine = `<div class="now-line" style="top:${top}px"><span></span></div>`;
  }
  return `<div class="timeline-wrap" style="height:${24*HOUR_H}px">
    <div class="timeline-hours">${hourRows.join('')}</div>
    <div class="timeline-events">${allEvents}${nowLine}</div>
  </div>`;
}
function scrollTimelineIntoView(){
  requestAnimationFrame(()=>{
    const el = document.querySelector('.now-line') || document.querySelector('.timeline-event');
    if(el && el.scrollIntoView) el.scrollIntoView({block:'center'});
  });
}
let _dayPullLock = false;
function attachDayPullBack(){
  const root = document.getElementById('view-root');
  if(!root || root.dataset.pullbackAttached === '1') return;
  root.dataset.pullbackAttached = '1';
  const scroller = root;
  let startY = 0, dragging = false, dy = 0, pointerId = null;
  const THRESHOLD = 70;
  const MAX_PULL = 140;
  const active = ()=> state.activeTab === 'day' && !!state.dayReturnTab;

  const reset = (animate)=>{
    root.style.transition = animate ? 'transform .2s ease' : '';
    root.style.transform = '';
    if(animate) setTimeout(()=>{ root.style.transition = ''; }, 220);
  };

  root.addEventListener('pointerdown', e=>{
    if(!active()) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(e.target.closest('button,a,input,textarea,select')) return;
    if(scroller.scrollTop > 4) return;
    startY = e.clientY;
    dragging = true; dy = 0; pointerId = e.pointerId;
    try{ root.setPointerCapture(pointerId); }catch(err){}
  });

  root.addEventListener('pointermove', e=>{
    if(!dragging || !active() || e.pointerId !== pointerId) return;
    if(scroller.scrollTop > 4){ dragging = false; reset(false); return; }
    const rawDy = e.clientY - startY;
    if(rawDy <= 0){ dy = 0; reset(false); return; }
    dy = Math.min(MAX_PULL, rawDy * 0.55);
    root.style.transition = '';
    root.style.transform = `translateY(${dy}px)`;
  });

  const endDrag = e=>{
    if(!dragging || (pointerId !== null && e.pointerId !== undefined && e.pointerId !== pointerId)) return;
    dragging = false;
    if(dy >= THRESHOLD && active()){
      reset(false);
      goBackFromDay();
    } else {
      reset(true);
    }
    dy = 0;
  };
  root.addEventListener('pointerup', endDrag);
  root.addEventListener('pointercancel', endDrag);

  root.addEventListener('wheel', e=>{
    if(!active() || scroller.scrollTop > 4) return;
    if(e.deltaY < -28){
      if(_dayPullLock) return;
      _dayPullLock = true;
      goBackFromDay();
      setTimeout(()=>{ _dayPullLock = false; }, 420);
    }
  }, {passive:true});
}

/* ================= WEEK VIEW ================= */
function getWeekStart(dateStr){
  const d = fromDateStr(dateStr);
  return addDays(d, -mondayIndex(d));
}
function renderWeekView(){
  const weekStart = getWeekStart(state.weekCursor);
  const weekEnd = addDays(weekStart, 6);
  const todaystr = todayStr();
  const sameMonth = weekStart.getMonth() === weekEnd.getMonth() && weekStart.getFullYear() === weekEnd.getFullYear();
  let rangeLabel;
  if(sameMonth){
    rangeLabel = `${MONTHS[weekStart.getMonth()]} ${weekStart.getDate()}–${weekEnd.getDate()}, ${weekEnd.getFullYear()}`;
  } else if(weekStart.getFullYear() === weekEnd.getFullYear()){
    rangeLabel = `${MONTHS[weekStart.getMonth()].slice(0,3)} ${weekStart.getDate()} – ${MONTHS[weekEnd.getMonth()].slice(0,3)} ${weekEnd.getDate()}, ${weekEnd.getFullYear()}`;
  } else {
    rangeLabel = `${MONTHS[weekStart.getMonth()].slice(0,3)} ${weekStart.getDate()}, ${weekStart.getFullYear()} – ${MONTHS[weekEnd.getMonth()].slice(0,3)} ${weekEnd.getDate()}, ${weekEnd.getFullYear()}`;
  }

  const rows = [];
  for(let i=0;i<7;i++){
    const d = addDays(weekStart, i);
    const dstr = toDateStr(d);
    const entries = entriesFor(dstr);
    const dayNotes = notesFor(dstr);
    const isToday = dstr === todaystr;

    let totalHours = 0;
    const chips = entries.map(e=>{
      const t = typeById(e.typeId);
      if(!t) return '';
      if(t.isWork && t.start && t.end) totalHours += shiftDurationHours(t);
      return `<span class="week-chip" style="background:${t.color};color:${textColorFor(t.color)}">
        ${TYPE_ICONS[t.icon]||TYPE_ICONS.sun}<span>${escapeHtml(t.name)}</span>${t.isWork && t.start && t.end ? `<span class="wc-time">${t.start}–${t.end}</span>` : ''}
      </span>`;
    }).join('');
    const noteChips = dayNotes.map(n=>`<span class="week-note-chip">${ICONS.note}${n.time?`<span class="mono" style="font-size:calc(10.5px * var(--fs-mult, 1)); opacity:.85">${escapeHtml(n.time)}</span>`:''}<span>${escapeHtml(n.text)}</span></span>`).join('');

    let body;
    if(!entries.length && !dayNotes.length){
      body = `<div class="week-empty">${tr('no_shifts')}</div>`;
    } else {
      body = `<div class="week-chip-row">${chips}${noteChips}</div>`;
    }

    rows.push(`<button class="week-day-row ${isToday?'today':''}" onclick="goToDay('${dstr}')">
      <div class="week-day-date">
        <div class="wd-dow">${WEEKDAYS[i]}</div>
        <div class="wd-num">${d.getDate()}</div>
      </div>
      <div class="week-day-body">${body}</div>
      ${totalHours>0?`<div class="week-hours">${totalHours.toFixed(1)}h</div>`:''}
    </button>`);
  }

  return `
    <div class="dateflip">
      <button class="icon-btn" onclick="shiftWeek(-1)">${ICONS.chevL}</button>
      <div style="text-align:center; cursor:pointer" onclick="openWeekPicker()">
        <div class="today-label">${tr('week_label')}</div>
        <h2 class="date-heading" style="font-size:calc(19px * var(--fs-mult, 1))">${rangeLabel}</h2>
      </div>
      <button class="icon-btn" onclick="shiftWeek(1)">${ICONS.chevR}</button>
    </div>
    <div class="week-list">${rows.join('')}</div>
  `;
}
function shiftWeek(n){
  state.weekCursor = toDateStr(addDays(fromDateStr(state.weekCursor), n*7));
  renderApp();
}

/* ================= MONTH VIEW ================= */
function multiColorGradient(colors){
  const n = colors.length;
  if(n === 0) return '';
  if(n === 1) return colors[0];
  const stops = [];
  colors.forEach((c,i)=>{
    const start = (100*i/n).toFixed(2);
    const end = (100*(i+1)/n).toFixed(2);
    stops.push(`${c} ${start}%`, `${c} ${end}%`);
  });
  return `linear-gradient(90deg, ${stops.join(', ')})`;
}
function renderMonthView(){
  return state.settings.calendarStyle === 'bars' ? renderMonthViewBars() : renderMonthViewClassic();
}
function renderMonthViewClassic(){
  const {y,m} = state.monthCursor;
  const first = new Date(y,m,1);
  const startOffset = mondayIndex(first);
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){
    const d = addDays(first, -(startOffset-i));
    cells.push({date:d, outside:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({date:new Date(y,m,d), outside:false});
  while(cells.length % 7 !== 0) cells.push({date:addDays(cells[cells.length-1].date,1), outside:true});

  const todaystr = todayStr();
  const nRows = cells.length / 7;
  const paintActive = state.paintMode.active;
  const gridHtml = cells.map(c=>{
    const dstr = toDateStr(c.date);
    const entries = entriesFor(dstr);
    const dayNotes = notesFor(dstr);
    const typeColors = [...new Set(entries.map(e=>{ const t=typeById(e.typeId); return t?t.color:null; }).filter(Boolean))];
    const singleColor = typeColors.length === 1 ? typeColors[0] : null;
    const multiShift = typeColors.length > 1;
    const bgStyle = singleColor ? `background:${singleColor};` : (multiShift ? `background:${multiColorGradient(typeColors)};` : '');
    const painted = !!singleColor || multiShift;
    const dayTypes = [...new Map(entries.map(e=>{ const t=typeById(e.typeId); return t ? [t.id,t] : null; }).filter(Boolean)).values()];
    const abbrText = dayTypes.length ? dayTypes.slice(0,2).map(t=>shiftAbbr(t.name)).join('/') + (dayTypes.length>2 ? `+${dayTypes.length-2}` : '') : '';
    const stripHtml = '';
    const hasNote = dayNotes.length > 0;

let _monthSwipeLock = false;
function attachMonthSwipe(){
  const el = document.getElementById('monthSwipeArea');
  if(!el) return;
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      e.preventDefault();
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, {passive:false});
  el.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 24){
      if(_monthSwipeLock) return;
      _monthSwipeLock = true;
      shiftMonth(e.deltaX > 0 ? 1 : -1);
      setTimeout(()=>{ _monthSwipeLock = false; }, 420);
    }
  }, {passive:true});
}

      <input type="text" id="listSearchInput" placeholder="${tr('search_list')}" value="${escapeHtml(state.searchQuery||'')}" oninput="onSearchList(this.value)" style="padding-right:32px;">
      ${state.searchQuery ? `<button onclick="onSearchList('');" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); font-size:16px; cursor:pointer; padding:0; line-height:1;">✕</button>` : ''}
    </div>
  `;

  const dateSet = new Set([...Object.keys(state.shifts||{}), ...Object.keys(state.notes||{})]);
  const allDates = [...dateSet].filter(dstr=>entriesFor(dstr).length || notesFor(dstr).length)
    .sort((a,b)=> fromDateStr(a).getTime() - fromDateStr(b).getTime());

  if(allDates.length === 0){
    return `
      <div class="section-title" style="margin-top:0">${tr('nav_list')}</div>
      <div class="empty-state">
        ${ICONS.calBlank}
        <div class="title">${tr('nothing_scheduled')}</div>
        <div>${tr('nothing_scheduled_sub')}</div>
      </div>
    `;
  }

  const matched = [];
  allDates.forEach(dstr=>{
    let entries = entriesFor(dstr);
    let notes = notesFor(dstr);
    if(query){
      notes = notes.filter(n => (n.text || '').toLowerCase().includes(query));
      entries = entries.filter(e => {
        const t = typeById(e.typeId);
        const shiftName = t ? t.name : '';
        return (e.notes || '').toLowerCase().includes(query) || shiftName.toLowerCase().includes(query);
      });
    }
    if(entries.length || notes.length) matched.push({dstr, entries, notes});
  });

  if(matched.length === 0 && query){
    return `
      <div class="section-title" style="margin-top:0">${tr('nav_list')}</div>
      ${searchInputHtml}
      <div class="empty-state">
        ${ICONS.calBlank}
        <div class="title">${tr('no_search_results')}</div>
      </div>
    `;
  }

  const todayTime = fromDateStr(todaystr).getTime();
  const isPastDate = (dstr) => {
    const t = fromDateStr(dstr).getTime();
    return !isNaN(t) && t < todayTime;
  };
  const pastItems = matched.filter(m => isPastDate(m.dstr));
  const currentItems = matched.filter(m => !isPastDate(m.dstr));

  const renderGroup = (m) => {
    const isToday = m.dstr === todaystr;
    const itemsHtml = m.entries.map(e=>renderAgendaItem(e, m.dstr)).join('')
      + m.notes.map(n=>renderNoteAgendaItem(n, m.dstr)).join('');
    return `
      <div class="section-title" style="margin-top:22px; cursor:pointer" onclick="goToDay('${m.dstr}')">${isToday?tr('today')+' · ':''}${fmtHuman(m.dstr)}</div>
      <div class="agenda-list">${itemsHtml}</div>
    `;
  };

  let pastHtml = '';
  let currentGroups = '';
  if(state.listPastExpanded){
    const pastGroupsHtml = pastItems.length
      ? pastItems.slice().reverse().map(renderGroup).join('')
      : `<div class="empty-state">${ICONS.calBlank}<div class="title">${tr('nothing_scheduled')}</div></div>`;
    pastHtml = `
      <div class="row-between" style="margin-top:0; cursor:pointer; opacity:.65;" onclick="togglePastList()">
        <div class="section-title" style="margin:0;">${tr('list_past')} · ${pastItems.length}</div>
        <span style="color:var(--text-muted); font-size:12px;">▲</span>
      </div>
      ${pastGroupsHtml}
    `;
  } else {
    if(pastItems.length){
      pastHtml = `
        <div class="row-between" style="padding:9px 12px; margin-bottom:2px; cursor:pointer; opacity:.65; border:1px dashed var(--border); border-radius:12px;" onclick="togglePastList()">
          <span style="font-size:calc(12px * var(--fs-mult, 1)); font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em;">${tr('list_past_count', {n: pastItems.length})}</span>
          <span style="color:var(--text-muted); font-size:12px;">▾</span>
        </div>
      `;
    }
    currentGroups = currentItems.map(renderGroup).join('');
  }

  return `
    <div class="section-title" style="margin-top:0">${tr('nav_list')}</div>
    ${searchInputHtml}
    ${pastHtml}
    ${currentGroups}
  `;
}

/* ================= METRICS ================= */
function renderMetrics(){
  const period = state.metricsPeriod;
  const today = new Date();
  let rangeDates = [];
  if(period === 'week'){
    const monIdx = mondayIndex(today);
    const monday = addDays(today, -monIdx);
    for(let i=0;i<7;i++) rangeDates.push(toDateStr(addDays(monday,i)));
  } else {
    const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
    for(let d=1; d<=daysInMonth; d++) rangeDates.push(toDateStr(new Date(today.getFullYear(), today.getMonth(), d)));
  }

  let totalHours = 0, daysWorked = 0, offDays = 0, vacationDays = 0;
  let regularHours = 0, extraHours = 0;
  const byType = {};
  state.shiftTypes.forEach(t => byType[t.id] = 0);

  rangeDates.forEach(dstr=>{
    const entries = entriesFor(dstr);
    if(!entries.length) return;
    let workedToday = false, offToday = false, vacToday = false;
    entries.forEach(e=>{
      const t = typeById(e.typeId);
      if(!t) return;
      if(t.isWork){
        const h = shiftDurationHours(t);
        totalHours += h;
        byType[t.id] = (byType[t.id]||0) + h;
        if(/extra/i.test(t.name)) extraHours += h; else regularHours += h;
        workedToday = true;
      } else {
        offToday = true;
        if(/vacation|holiday|pto|leave|vacacion|vacaciones/i.test(t.name)) vacToday = true;
      }
    });
    if(workedToday) daysWorked++;
    if(offToday && !workedToday) offDays++;
    if(vacToday) vacationDays++;
  });

  const hourlyWage = state.settings.hourlyWage;
  const extraHourlyWage = state.settings.extraHourlyWage;
  let earningsHtml = '';
  if(hourlyWage != null){
    const extraRate = extraHourlyWage != null ? extraHourlyWage : hourlyWage;
    const regularPay = regularHours * hourlyWage;
    const extraPay = extraHours * extraRate;
    const totalPay = regularPay + extraPay;
    earningsHtml = `
      <div class="section-title">${tr('earnings_title')}</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="lab">${tr('regular_earnings')}</div><div class="big-num">${regularPay.toFixed(2)}</div></div>
        ${extraHours > 0 ? `<div class="stat-card"><div class="lab">${tr('extra_earnings')}</div><div class="big-num">${extraPay.toFixed(2)}</div></div>` : ''}
        <div class="stat-card"><div class="lab">${tr('total_earnings')}</div><div class="big-num">${totalPay.toFixed(2)}</div></div>
      </div>
      ${extraHourlyWage == null && extraHours > 0 ? `<div class="text-muted" style="font-size:calc(12px * var(--fs-mult, 1)); margin:-6px 2px 6px">${tr('extra_wage_uses_regular')}</div>` : ''}
    `;
  }

  const maxTypeHours = Math.max(1, ...Object.values(byType));
  const breakdownRows = state.shiftTypes.filter(t=>t.isWork).map(t=>{
    const h = byType[t.id]||0;
    return `<div class="bar-row">
      <div class="bar-key">${escapeHtml(t.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(h/maxTypeHours*100).toFixed(0)}%;background:${t.color}"></div></div>
      <div class="bar-val">${h.toFixed(1)}h</div>
    </div>`;
  }).join('');

  return `
    <div class="section-title" style="margin-top:0">${tr('metrics_title')}</div>
    <div class="modeToggle">
      <button class="${period==='week'?'active':''}" onclick="setMetricsPeriod('week')">${tr('this_week')}</button>
      <button class="${period==='month'?'active':''}" onclick="setMetricsPeriod('month')">${tr('this_month')}</button>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="lab">${tr('hours_worked')}</div><div class="big-num">${totalHours.toFixed(1)}<span style="font-size:calc(14px * var(--fs-mult, 1));color:var(--text-muted)"> h</span></div></div>
      <div class="stat-card"><div class="lab">${tr('days_worked')}</div><div class="big-num">${daysWorked}</div></div>
      <div class="stat-card"><div class="lab">${tr('off_days')}</div><div class="big-num">${offDays}</div></div>
      <div class="stat-card"><div class="lab">${tr('vacation_days')}</div><div class="big-num">${vacationDays}</div></div>
    </div>
    ${earningsHtml}
    <div class="section-title">${tr('hours_by_type')}</div>
    <div class="card">
      ${breakdownRows || `<div class="text-muted" style="font-size:calc(13.5px * var(--fs-mult, 1))">${tr('no_hours_logged')}</div>`}
    </div>
    <div class="section-title">${tr('wage_settings_section')}</div>
    <div class="card">
      <div class="text-muted" style="font-size:calc(12.5px * var(--fs-mult, 1)); margin-bottom:12px; line-height:1.4">${tr('wage_settings_hint')}</div>
      <div style="margin-bottom:10px">
        <label style="font-size:calc(12px * var(--fs-mult, 1)); color:var(--text-muted); display:block; margin-bottom:4px">${tr('hourly_wage_label')}</label>
        <input type="number" inputmode="decimal" step="0.01" min="0" value="${state.settings.hourlyWage != null ? state.settings.hourlyWage : ''}" onchange="setHourlyWageFromMetrics(this.value)">
      </div>
      <div>
        <label style="font-size:calc(12px * var(--fs-mult, 1)); color:var(--text-muted); display:block; margin-bottom:4px">${tr('extra_hourly_wage_label')}</label>
        <input type="number" inputmode="decimal" step="0.01" min="0" value="${state.settings.extraHourlyWage != null ? state.settings.extraHourlyWage : ''}" onchange="setExtraHourlyWageFromMetrics(this.value)">
      </div>
    </div>
  `;
}

/* ================= SHEET / MODAL HELPERS ================= */
function showSheet(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="sheet-wrap"><button class="sheet-close" onclick="closeModal()" aria-label="Close">${ICONS.close}</button><div class="sheet">${html}</div></div></div>`;
  const handle = root.querySelector('.sheet-handle');
  const sheet = root.querySelector('.sheet');
  if(handle && sheet) enableSheetDragToClose(handle, sheet);
}
function enableSheetDragToClose(handle, sheet){
  const DISMISS_PX = 80;
  let dragging = false, startY = 0, dy = 0;
  function pointY(e){ return e.touches ? e.touches[0].clientY : e.clientY; }
  function onDown(e){
    dragging = true; dy = 0;
    startY = pointY(e);
    sheet.style.transition = 'none';
    if(e.pointerId != null && handle.setPointerCapture){ try{ handle.setPointerCapture(e.pointerId); }catch(err){} }
  }
  function onMove(e){
    if(!dragging) return;
    dy = Math.max(0, pointY(e) - startY);
    sheet.style.transform = 'translateY(' + dy + 'px)';
    if(dy > 4 && e.cancelable) e.preventDefault();
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    if(dy > DISMISS_PX){
      sheet.style.transform = 'translateY(100%)';
      setTimeout(closeModal, 160);
    } else {
      sheet.style.transform = '';
    }
  }
  handle.addEventListener('pointerdown', onDown);
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onUp);
  handle.addEventListener('touchstart', onDown, {passive:true});
  handle.addEventListener('touchmove', onMove, {passive:false});
  handle.addEventListener('touchend', onUp);
  handle.addEventListener('click', ()=>{ if(dy < 4) closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function ensureNoteRemindersPermission(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'granted'){
    if(!state.settings.remindersEnabled){ state.settings.remindersEnabled = true; DB.saveSettings(state.settings); }
    return;
  }
  if(Notification.permission !== 'denied'){
    Notification.requestPermission().then(perm=>{
      if(perm === 'granted'){
        state.settings.remindersEnabled = true;
        DB.saveSettings(state.settings);
      } else {
        showToast(tr('reminders_denied'));
      }
    });
  } else {
    showToast(tr('reminders_denied'));
  }
}

  const notifyChecked = !!document.getElementById('addNoteNotify')?.checked;
  let notifyH = parseInt(document.getElementById('addNoteNotifyH')?.value, 10);
  let notifyM = parseInt(document.getElementById('addNoteNotifyM')?.value, 10);
  if(isNaN(notifyH) || notifyH < 0) notifyH = 0;
  if(isNaN(notifyM) || notifyM < 0) notifyM = 0;
  let notifyHoursVal = notifyH + (notifyM/60);
  if(notifyHoursVal <= 0) notifyHoursVal = 1;
  if(!text){ showToast(tr('toast_write_something')); return; }
  if(notifyChecked && !time){ showToast(tr('toast_need_time_for_notify')); return; }
  const notify = notifyChecked && !!time;
  const dateStr = state.selectedDate;
  if(!state.notes[dateStr]) state.notes[dateStr] = [];
  if(state.addCtx.noteId){
    const n = state.notes[dateStr].find(x=>x.id===state.addCtx.noteId);
    if(n){ n.text = text; n.time = time; n.notify = notify; n.notifyHours = notifyHoursVal; }
  } else {
    state.notes[dateStr].push({ id: uid(), text, time, notify, notifyHours: notifyHoursVal });
  }
  DB.saveNotes(state.notes);
  if(notify) ensureNoteRemindersPermission();
  state.addCtx.noteId = null;
  _addDraftText = '';
  _addDraftTime = '';
  setTab(state.returnTab || 'day');
  showToast(tr('toast_note_saved'));
}

  state.addCtx.noteId = null;

}

/* ---- Reminders ---- */
function firedRemindersGet(){ return DB.lsGet('remindersFired') || {}; }
function firedRemindersMark(id){
  const fired = firedRemindersGet();
  fired[id] = Date.now();
  const cutoff = Date.now() - 2*24*60*60*1000;
  Object.keys(fired).forEach(k=>{ if(fired[k] < cutoff) delete fired[k]; });
  DB.lsSet('remindersFired', fired);
}
function checkReminders(){
  if(!state.settings.remindersEnabled) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date();
  const dstr = todayStr();
  const fired = firedRemindersGet();
  notesFor(dstr).forEach(n=>{
    if(!n.time || !n.notify) return;
    const id = dstr + ':' + n.id;
    if(fired[id]) return;
    const [h,mi] = n.time.split(':').map(Number);
    if(isNaN(h) || isNaN(mi)) return;
    const leadHours = Number(n.notifyHours) > 0 ? Number(n.notifyHours) : 1;
    const leadMinutes = Math.round(leadHours*60);
    const eventTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, mi, 0);
    const reminderTime = new Date(eventTime.getTime() - leadMinutes*60000);
    if(now >= reminderTime && now < eventTime){
      try{ new Notification(tr('reminder_title'), { body: tr('reminder_body_hours', {hours:formatLeadTime(leadHours), time:n.time, text:n.text||''}) }); }
      catch(e){ console.error('Notification failed', e); }
      firedRemindersMark(id);
    }
  });
}

/* ---- Weekly digest ---- */
function weeklyDigestFiredGet(){ return DB.lsGet('weeklyDigestFired') || {}; }
function weeklyDigestFiredMark(dstr){
  const fired = weeklyDigestFiredGet();
  fired[dstr] = Date.now();
  const cutoff = Date.now() - 30*24*60*60*1000;
  Object.keys(fired).forEach(k=>{ if(fired[k] < cutoff) delete fired[k]; });
  DB.lsSet('weeklyDigestFired', fired);
}
function checkWeeklyDigest(){
  if(!state.settings.weeklyDigestEnabled) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date();
  if(now.getDay() !== 0) return;
  const dstr = todayStr();
  const fired = weeklyDigestFiredGet();
  if(fired[dstr]) return;
  const items = [];
  for(let i=0;i<7;i++){
    const ds = toDateStr(addDays(now, i));
    notesFor(ds).forEach(n=>{ items.push({ds, n}); });
  }
  let body;
  if(items.length === 0){
    body = tr('weekly_digest_body_none');
  } else {
    const shown = items.slice(0,5).map(it=>`${fmtHumanShort(it.ds)}: ${it.n.text}`);
    body = tr('weekly_digest_body', {n:items.length, s:items.length===1?'':'s'}) + '\n' + shown.join('\n');
    if(items.length > 5) body += '\n' + tr('weekly_digest_more', {n:items.length-5});
  }
  try{ new Notification(tr('weekly_digest_title'), { body }); }
  catch(e){ console.error('Notification failed', e); }
  weeklyDigestFiredMark(dstr);
}
function enableReminders(){
  if(typeof Notification === 'undefined'){ showToast(tr('reminders_unsupported')); return; }
  if(Notification.permission === 'granted'){

    showToast(tr('reminders_on'));

    renderApp();
  });
}

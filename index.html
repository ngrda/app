  if(!typeId){ showToast(tr('toast_pick_type')); return; }
  const notes = (document.getElementById('addShiftNotes')?.value || '').trim();
  const dateStr = state.selectedDate;
  if(!state.shifts[dateStr]) state.shifts[dateStr] = [];
  state.shifts[dateStr].push({ id: uid(), typeId, notes });
  DB.saveShifts(state.shifts);
  _addDraftText = '';
  setTab(state.returnTab || 'day');
  showToast(tr('toast_shift_added'));
}
function saveAddNote(){
  const text = (document.getElementById('addNoteText')?.value || '').trim();
  const time = (document.getElementById('addNoteTime')?.value || '').trim();
  if(!text){ showToast(tr('toast_write_something')); return; }
  const dateStr = state.selectedDate;
  if(!state.notes[dateStr]) state.notes[dateStr] = [];
  if(state.addCtx.noteId){
    const n = state.notes[dateStr].find(x=>x.id===state.addCtx.noteId);
    if(n){ n.text = text; n.time = time; }
  } else {
    state.notes[dateStr].push({ id: uid(), text, time });
  }
  DB.saveNotes(state.notes);
  state.addCtx.noteId = null;
  _addDraftText = '';
  _addDraftTime = '';
  setTab(state.returnTab || 'day');
  showToast(tr('toast_note_saved'));
}
function cancelNoteEdit(){
  state.addCtx.noteId = null;
  _addDraftText = '';
  _addDraftTime = '';
  renderApp();
}

/* ================= SHIFT TYPES MANAGER ================= */
function openShiftTypesManager(){
  renderShiftTypesManager();
}
function renderShiftTypesManager(){
  const rows = state.shiftTypes.map(t=>`
    <div class="shifttype-row">
      <div class="shifttype-swatch" style="background:${t.color};color:${textColorFor(t.color)}">${TYPE_ICONS[t.icon]||TYPE_ICONS.sun}</div>
      <div class="shifttype-info">
        <div class="shifttype-name">${escapeHtml(t.name)}</div>
        <div class="shifttype-meta">${t.isWork ? `${t.start}–${t.end}${t.breakMins?` · ${t.breakMins}m ${tr('brk_abbrev')}`:''}` : tr('not_counted_work')}</div>
      </div>
      <div class="shifttype-actions">
        <button onclick="openRangeAssign('${t.id}')" aria-label="Assign to range">${ICONS.range}</button>
        <button onclick="openShiftTypeEditor('${t.id}')" aria-label="Edit">${ICONS.edit}</button>
        <button onclick="deleteShiftType('${t.id}')" aria-label="Delete">${ICONS.trash}</button>
      </div>
    </div>`).join('');
  const html = `
    <div class="sheet-handle"></div>
    <h2>${tr('shift_types_title')}<button class="icon-btn" onclick="closeModal()">${ICONS.close}</button></h2>
    ${rows || `<div class="empty-state" style="padding:24px 8px">${ICONS.layers}<div class="title">${tr('no_shift_types_yet')}</div><div>${tr('create_first_below')}</div></div>`}
    <button class="btn btn-primary" style="margin-top:6px" onclick="openShiftTypeEditor()">${ICONS.plus}${tr('new_shift_type')}</button>
  `;
  showSheet(html);
}
function deleteShiftType(id){
  state.shiftTypes = state.shiftTypes.filter(t=>t.id!==id);
  Object.keys(state.shifts).forEach(dstr=>{
    state.shifts[dstr] = state.shifts[dstr].filter(e=>e.typeId!==id);
    if(state.shifts[dstr].length===0) delete state.shifts[dstr];
  });
  DB.saveShiftTypes(state.shiftTypes);
  DB.saveShifts(state.shifts);
  renderShiftTypesManager();
  showToast(tr('toast_type_deleted'));
}

/* ---- Shift type editor (create/edit) ---- */
let _typeEditorCtx = null;
function openShiftTypeEditor(id){
  const existing = id ? typeById(id) : null;
  _typeEditorCtx = existing ? {...existing} : {
    id: uid(), name:'', start:'09:00', end:'17:00', breakMins:0, color:SWATCHES[0], icon:TYPE_ICON_KEYS[0], isWork:true, _new:true
  };
  renderShiftTypeEditor();
}
function renderShiftTypeEditor(){
  const t = _typeEditorCtx;
  const swatches = SWATCHES.map(c=>`<button class="swatch ${t.color===c?'selected':''}" style="background:${c}" onclick="updateTypeField('color','${c}')"></button>`).join('');
  const icons = TYPE_ICON_KEYS.map(k=>`<button class="icon-opt ${t.icon===k?'selected':''}" onclick="updateTypeField('icon','${k}')">${TYPE_ICONS[k]}</button>`).join('');
  const html = `
    <div class="sheet-handle"></div>
    <h2>${t._new?tr('new_shift_type'):tr('edit_shift_type')}</h2>
    <div class="field">
      <label>${tr('name_label')}</label>
      <input id="typeName" type="text" placeholder="${tr('name_placeholder')}" value="${escapeHtml(t.name)}" oninput="updateTypeField('name', this.value)">
    </div>
    <div class="field">
      <div class="checkbox-row">
        <input type="checkbox" id="typeIsWork" ${t.isWork?'checked':''} onchange="updateTypeField('isWork', this.checked)">
        <label for="typeIsWork">${tr('counts_as_work')}</label>
      </div>
    </div>
    ${t.isWork ? `
    <div class="field two-col">
      <div><label>${tr('start_time')}</label><input type="time" value="${t.start}" onchange="updateTypeField('start', this.value)"></div>
      <div><label>${tr('end_time')}</label><input type="time" value="${t.end}" onchange="updateTypeField('end', this.value)"></div>
    </div>
    <div class="field">
      <label>${tr('break_duration')}</label>
      <input type="number" min="0" step="5" value="${t.breakMins||0}" onchange="updateTypeField('breakMins', this.value)">
    </div>` : ''}
    <div class="field">
      <label>${tr('color_label')}</label>
      <div class="swatch-grid">${swatches}</div>
    </div>
    <div class="field">
      <label>${tr('icon_label')}</label>
      <div class="icon-grid">${icons}</div>
    </div>
    <button class="btn btn-primary" onclick="saveShiftType()">${tr('save_shift_type')}</button>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="openShiftTypesManager()">${tr('cancel')}</button>
  `;
  showSheet(html);
}
function updateTypeField(field, value){
  _typeEditorCtx[field] = value;
  if(field==='isWork' || field==='color' || field==='icon') renderShiftTypeEditor();
}
function saveShiftType(){
  const t = _typeEditorCtx;
  if(!t.name || !t.name.trim()){ showToast(tr('give_name_first')); return; }
  const clean = { id:t.id, name:t.name.trim(), start:t.start, end:t.end, breakMins:Number(t.breakMins)||0, color:t.color, icon:t.icon, isWork:!!t.isWork };
  const idx = state.shiftTypes.findIndex(x=>x.id===t.id);
  if(idx>=0) state.shiftTypes[idx] = clean; else state.shiftTypes.push(clean);
  DB.saveShiftTypes(state.shiftTypes);
  renderApp();
  openShiftTypesManager();
  showToast(t._new?tr('toast_type_created'):tr('toast_type_updated'));
}

/* ---- Bulk range assignment ---- */
let _rangeCtx = null;
function openRangeAssign(typeId){
  _rangeCtx = { typeId, from: todayStr(), to: todayStr(), replace: true };
  renderRangeAssign();
}
function renderRangeAssign(){
  const t = typeById(_rangeCtx.typeId);
  const html = `
    <div class="sheet-handle"></div>
    <h2>${tr('assign_prefix')} "${escapeHtml(t.name)}"</h2>
    <div class="field two-col">
      <div><label>${tr('from_label')}</label><input type="date" value="${_rangeCtx.from}" onchange="_rangeCtx.from=this.value"></div>
      <div><label>${tr('to_label')}</label><input type="date" value="${_rangeCtx.to}" onchange="_rangeCtx.to=this.value"></div>
    </div>
    <div class="field">
      <div class="checkbox-row">
        <input type="checkbox" id="rangeReplace" ${_rangeCtx.replace?'checked':''} onchange="_rangeCtx.replace=this.checked">
        <label for="rangeReplace">${tr('replace_existing')}</label>
      </div>
      <div class="field-hint">${tr('applies_hint',{n:escapeHtml(t.name)})}</div>
    </div>
    <button class="btn btn-primary" onclick="applyRangeAssign()">${tr('apply_to_range')}</button>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="openShiftTypesManager()">${tr('cancel')}</button>
  `;
  showSheet(html);
}
function applyRangeAssign(){
  const { typeId, from, to, replace } = _rangeCtx;
  if(!from || !to || from > to){ showToast(tr('check_date_range')); return; }
  let d = fromDateStr(from);
  const end = fromDateStr(to);
  let count = 0;
  while(d <= end){
    const dstr = toDateStr(d);
    if(replace || !state.shifts[dstr]) state.shifts[dstr] = [];
    state.shifts[dstr].push({ id: uid(), typeId, notes:'' });
    count++;
    d = addDays(d,1);
  }
  DB.saveShifts(state.shifts);
  closeModal();
  renderApp();
  showToast(tr('toast_applied_days',{n:count, s:count===1?'':'s'}));
}

/* ================= ICS EXPORT ================= */
function exportICS(){
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rota//Shift Calendar//EN'];
  Object.keys(state.shifts).sort().forEach(dstr=>{
    entriesFor(dstr).forEach(e=>{
      const t = typeById(e.typeId);
      if(!t) return;
      const dNoDash = dstr.replace(/-/g,'');
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+e.id+'@rota');
      lines.push('SUMMARY:'+escapeICS(t.name));
      if(t.isWork && t.start && t.end){
        const startMin = timeToMin(t.start);
        let endMin = timeToMin(t.end);
        let endDate = fromDateStr(dstr);
        if(endMin <= startMin){ endDate = addDays(endDate,1); }
        lines.push('DTSTART:'+dNoDash+'T'+t.start.replace(':','')+'00');
        lines.push('DTEND:'+toDateStr(endDate).replace(/-/g,'')+'T'+t.end.replace(':','')+'00');
      } else {
        lines.push('DTSTART;VALUE=DATE:'+dNoDash);
        lines.push('DTEND;VALUE=DATE:'+toDateStr(addDays(fromDateStr(dstr),1)).replace(/-/g,''));
      }
      if(e.notes) lines.push('DESCRIPTION:'+escapeICS(e.notes));
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rota-shifts.ics';
  a.click();
  showToast(tr('toast_calendar_downloaded'));
}
function escapeICS(s){ return String(s).replace(/[\\;,]/g, m=>'\\'+m).replace(/\n/g,'\\n'); }

/* ---- Backup / restore: the real safety net against local storage getting wiped
   (e.g. iOS can sometimes forget a web app's local data when its Home Screen icon
   is removed and re-added). Exporting a backup file and restoring it always works,
   regardless of what the browser/OS did to local storage. ---- */
function exportBackup(){
  const payload = {
    app:'rota-shift-calendar', version:1, exportedAt:new Date().toISOString(),
    shiftTypes: state.shiftTypes, shifts: state.shifts, notes: state.notes, settings: state.settings
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rota-backup-' + todayStr() + '.json';
  a.click();
  showToast(tr('toast_backup_saved'));
}
function importBackupFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || (!data.shiftTypes && !data.shifts && !data.notes)){
        showToast(tr('toast_backup_invalid'));
        return;
      }
      if(Array.isArray(data.shiftTypes)) state.shiftTypes = data.shiftTypes;
      if(data.shifts && typeof data.shifts === 'object') state.shifts = data.shifts;
      if(data.notes && typeof data.notes === 'object') state.notes = data.notes;
      if(data.settings && typeof data.settings === 'object') state.settings = {...DEFAULT_SETTINGS, ...data.settings};
      DB.saveShiftTypes(state.shiftTypes);
      DB.saveShifts(state.shifts);
      DB.saveNotes(state.notes);
      DB.saveSettings(state.settings);
      applyLanguageArrays();
      applyTheme();
      closeModal();
      renderApp();
      showToast(tr('toast_backup_restored'));
    }catch(e){
      console.error('Backup restore failed', e);
      showToast(tr('toast_backup_invalid'));
    }
  };
  reader.readAsText(file);
}

/* ================= SWAP CARD (canvas share image) ================= */
function openSwapCard(dateStr, entryId){
  const entry = entriesFor(dateStr).find(e=>e.id===entryId);
  const t = entry ? typeById(entry.typeId) : null;
  if(!entry || !t) return;
  const canvas = document.createElement('canvas');
  drawSwapCard(canvas, dateStr, entry, t);
  const imgUrl = canvas.toDataURL('image/png');
  const html = `
    <div class="sheet-handle"></div>
    <h2>${tr('swap_card_title')}</h2>
    <div class="swapcard-preview"><img src="${imgUrl}"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick='downloadSwapCard(${JSON.stringify(dateStr)}, ${JSON.stringify(entryId)})'>${ICONS.download}${tr('download')}</button>
      <button class="btn btn-primary" onclick='copySwapCard(${JSON.stringify(dateStr)}, ${JSON.stringify(entryId)})'>${ICONS.copy}${tr('copy_image')}</button>
    </div>
  `;
  showSheet(html);
}
function drawSwapCard(canvas, dateStr, entry, t){
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const hex = t.color;
  const textHex = textColorFor(hex);
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, shadeColor(hex,14));
  grad.addColorStop(1, shadeColor(hex,-18));
  ctx.fillStyle = grad;
  roundRect(ctx,0,0,W,H,48); ctx.fill();

  ctx.fillStyle = textHex;
  ctx.globalAlpha = .85;
  ctx.font = '600 30px Inter, sans-serif';
  ctx.fillText(tr('swap_request'), 64, 96);
  ctx.globalAlpha = 1;

  ctx.font = '700 74px "Space Grotesk", sans-serif';
  ctx.fillText(fmtHuman(dateStr), 60, 210, W-120);

  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  roundRect(ctx,60,290,W-120,H-290-220,36); ctx.fill();

  ctx.fillStyle = '#14161F';
  ctx.font = '700 46px "Space Grotesk", sans-serif';
  ctx.fillText(t.name + ' ' + tr('shift_suffix'), 104, 380);

  ctx.fillStyle = '#6B6D7A';
  ctx.font = '600 30px "JetBrains Mono", monospace';
  if(t.isWork){
    ctx.fillText(t.start + '  –  ' + t.end, 104, 430);
    ctx.fillStyle = '#14161F';
    ctx.font = '700 88px "JetBrains Mono", monospace';
    ctx.fillText(shiftDurationHours(t).toFixed(1)+'h', 104, 560);
    ctx.fillStyle = '#6B6D7A';
    ctx.font = '600 26px Inter, sans-serif';
    ctx.fillText(tr('total_hours') + (t.breakMins?`  ·  ${t.breakMins}m ${tr('break_word')}`:''), 104, 605);
  }
  if(entry.notes){
    ctx.fillStyle = '#14161F';
    ctx.font = '500 28px Inter, sans-serif';
    wrapText(ctx, entry.notes, 104, 700, W-120-88, 38);
  }

  ctx.fillStyle = textHex;
  ctx.globalAlpha = .9;
  ctx.font = '600 26px Inter, sans-serif';
  ctx.fillText(tr('generated_with'), 64, H-70);
}
function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#',''),16);
  let r=(num>>16), g=(num>>8&0x00FF), b=(num&0x0000FF);
  r=Math.min(255,Math.max(0,r+Math.round(2.55*percent)));
  g=Math.min(255,Math.max(0,g+Math.round(2.55*percent)));
  b=Math.min(255,Math.max(0,b+Math.round(2.55*percent)));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let cy = y;
  for(const w of words){
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, cy);
      line = w + ' ';
      cy += lineHeight;
    } else line = test;
  }
  ctx.fillText(line, x, cy);
}
function downloadSwapCard(dateStr, entryId){
  const entry = entriesFor(dateStr).find(e=>e.id===entryId);
  const t = entry ? typeById(entry.typeId) : null;
  if(!entry || !t) return;
  const canvas = document.createElement('canvas');
  drawSwapCard(canvas, dateStr, entry, t);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `shift-swap-${dateStr}.png`;
  a.click();
  showToast(tr('toast_image_downloaded'));
}
async function copySwapCard(dateStr, entryId){
  const entry = entriesFor(dateStr).find(e=>e.id===entryId);
  const t = entry ? typeById(entry.typeId) : null;
  if(!entry || !t) return;
  const canvas = document.createElement('canvas');
  drawSwapCard(canvas, dateStr, entry, t);
  try{
    canvas.toBlob(async (blob)=>{
      if(navigator.clipboard && window.ClipboardItem){
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        showToast(tr('toast_copied'));
      } else {
        downloadSwapCard(dateStr, entryId);
      }
    });
  }catch(e){
    downloadSwapCard(dateStr, entryId);
  }
}

/* ================= Toast ================= */
let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(()=>t.remove(), 2200);
}

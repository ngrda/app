<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Rota — Shift Calendar</title>
<meta name="theme-color" content="#14161F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F3; --bg-elevated:#FFFFFF; --bg-sunken:#EFEEE7;
  --text:#14161F; --text-muted:#6B6D7A; --border:#E4E3DC;
  --accent:#6C5CE7; --accent-text:#FFFFFF;
  --danger:#E5484D;
  --shadow: 0 8px 24px rgba(20,22,31,0.08), 0 2px 6px rgba(20,22,31,0.06);
  --shadow-lg: 0 20px 50px rgba(20,22,31,0.20), 0 6px 16px rgba(20,22,31,0.10);
  --glass: rgba(255,255,255,0.6);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:18px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
html.dark{
  --bg:#14161F; --bg-elevated:#1D2030; --bg-sunken:#191B27;
  --text:#F5F5F2; --text-muted:#9B9DB0; --border:#2B2E42;
  --accent:#9C90FF; --accent-text:#14161F;
  --shadow: 0 8px 24px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35);
  --glass: rgba(29,32,48,0.55);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none; transition:background .25s ease, color .25s ease;
}
h1,h2,h3,.display{font-family:var(--font-display); letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; background:var(--bg-sunken); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:15px; outline:none; width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);}
textarea{resize:vertical; min-height:64px;}
#app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative;}

/* ---------- Header ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  padding:calc(12px + var(--safe-top)) 16px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.brand{display:flex; align-items:center; gap:9px; flex-shrink:0;}
.brand-mark{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg, #9C90FF, var(--accent)); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow);}
.brand h1{font-size:19px; margin:0; font-weight:700;}
.icon-btn{width:38px; height:38px; border-radius:12px; border:1px solid var(--border); background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; color:var(--text); transition:transform .15s ease, background .15s ease; flex-shrink:0; position:relative;}
.icon-btn:active{transform:scale(0.92);}
.icon-btn svg{width:18px; height:18px;}
.icon-btn.accent{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 35%, var(--border));}
.header-actions{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;}
.header-actions::-webkit-scrollbar{display:none;}

/* ---------- Nav / view swap ---------- */
main{flex:1; padding:16px 16px calc(96px + var(--safe-bottom)); animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:560px; margin:0 auto;
  background:color-mix(in srgb, var(--bg-elevated) 92%, transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border); padding:8px 8px calc(8px + var(--safe-bottom));
  display:grid; grid-template-columns:repeat(4,1fr); gap:2px;
}
.navbtn{display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px; border:none; background:transparent; border-radius:12px; color:var(--text-muted); font-size:10.5px; font-weight:600; transition:color .15s ease, background .15s ease;}
.navbtn svg{width:21px; height:21px; transition:transform .15s ease;}
.navbtn.active{color:var(--accent);}
.navbtn.active svg{transform:translateY(-1px);}
.navbtn.active .navdot{opacity:1; transform:scale(1);}
.navbtn.navbtn-add.active{color:var(--accent);}
.navdot{width:4px; height:4px; border-radius:50%; background:var(--accent); opacity:0; transform:scale(0); transition:.15s ease;}
.navbtn:active{transform:scale(.93);}

/* ---------- Cards / shared ---------- */
.card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.card.flat{box-shadow:none;}
.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); font-weight:700; margin:22px 2px 10px; display:flex; align-items:center; justify-content:space-between;}
.section-title:first-child{margin-top:0;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.pillbtn{border:1px solid var(--border); background:var(--bg-elevated); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:6px;}
.pillbtn:active{transform:scale(.95);}
.pillbtn svg{width:15px; height:15px;}
.chip{border-radius:12px; padding:10px 12px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; border:2px solid transparent;}
.chip svg{width:16px; height:16px;}
.big-num{font-family:var(--font-mono); font-weight:700; font-size:26px;}
.text-muted{color:var(--text-muted);}
.empty-state{text-align:center; padding:36px 16px; color:var(--text-muted);}
.empty-state svg{width:42px; height:42px; margin-bottom:12px; opacity:.5;}
.empty-state .title{font-weight:700; font-size:15px; color:var(--text); margin-bottom:4px;}

/* ---------- Day view (agenda, compact) ---------- */
.dateflip{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px;}
.dateflip .today-label{font-size:13px; color:var(--text-muted); font-weight:600;}
.dateflip .date-heading{font-size:22px; font-weight:700; margin:1px 0 0;}
.agenda-list{display:flex; flex-direction:column; gap:10px;}
.agenda-item{display:flex; align-items:flex-start; gap:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:13px 14px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:box-shadow .15s ease, transform .15s ease;}
.agenda-item::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--stripe,var(--accent));}
.agenda-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:4px;}
.agenda-icon svg{width:19px; height:19px;}
.agenda-body{flex:1; min-width:0;}
.agenda-title-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.agenda-name{font-weight:700; font-size:14.5px;}
.agenda-time{font-family:var(--font-mono); font-size:12px; color:var(--text-muted); margin-top:2px;}
.agenda-notes{font-size:13px; color:var(--text-muted); margin-top:6px; line-height:1.4;}
.agenda-actions{display:flex; gap:4px; flex-shrink:0;}
.agenda-actions button{width:30px; height:30px; border-radius:99px; border:none; background:var(--bg-sunken); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.agenda-actions button svg{width:14px; height:14px;}
.agenda-actions button:active{transform:scale(.9);}
.add-shift-row{display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--border); border-radius:14px; padding:13px; color:var(--text-muted); font-weight:600; font-size:13.5px; margin-top:2px; background:transparent; transition:border-color .15s ease, color .15s ease, background .15s ease;}
.add-shift-row svg{width:16px; height:16px;}
.add-shift-row:active{transform:scale(.98);}
.add-shift-row:hover{border-color:var(--accent); color:var(--accent);}
.quickadd-row{display:flex; gap:8px; margin-top:12px;}
.quickadd-row .add-shift-row{flex:1; margin-top:0;}
.agenda-item.note-item::before{background:var(--text-muted);}
.agenda-item.note-item .agenda-icon{background:var(--bg-sunken); color:var(--text-muted);}
.agenda-item.note-item .agenda-name{color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em;}
.agenda-item.note-item .agenda-notes{color:var(--text); font-size:14px; margin-top:3px;}

/* ---------- Hourly timeline (Day view) ---------- */
.timeline-wrap{position:relative; border-radius:16px; background:var(--bg-elevated); border:1px solid var(--border); box-shadow:var(--shadow); overflow:hidden; margin-top:2px;}
.timeline-hours{position:absolute; inset:0;}
.hour-row{height:56px; border-top:1px solid var(--border); position:relative;}
.hour-row:first-child{border-top:none;}
.hour-label{position:absolute; left:10px; top:-7px; font-size:10px; font-weight:600; color:var(--text-muted); font-family:var(--font-mono); background:var(--bg-elevated); padding:0 4px; z-index:1;}
.timeline-events{position:absolute; top:0; left:56px; right:8px; bottom:0;}
.timeline-event{position:absolute; left:0; right:0; border-radius:10px; padding:6px 10px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; z-index:2;}
.timeline-event:active{transform:scale(.97);}
.te-name{font-weight:700; font-size:12.5px; line-height:1.25;}
.te-time{font-family:var(--font-mono); font-size:10.5px; opacity:.85; margin-top:1px;}
.te-notes{font-size:10.5px; opacity:.85; margin-top:3px; line-height:1.35;}
.now-line{position:absolute; left:0; right:0; height:0; border-top:2px solid var(--danger); z-index:3; pointer-events:none;}
.now-line span{position:absolute; left:-4px; top:-4.5px; width:9px; height:9px; border-radius:50%; background:var(--danger); box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent);}

/* ---------- Month grid ---------- */
.month-grid-head{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
.month-grid-head div{text-align:center; font-size:11px; font-weight:700; color:var(--text-muted);}
.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.day-cell{aspect-ratio:1/1; border-radius:13px; background:var(--bg-elevated); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:5px 3px 3px; gap:1px; position:relative; font-weight:700; font-size:12.5px; overflow:hidden;}
.day-cell{transition:transform .1s ease, box-shadow .15s ease;}
.day-cell:active{transform:scale(.93);}
.day-cell.outside{opacity:.25;}
.day-cell.today{outline:2px solid var(--accent); outline-offset:-2px; background:color-mix(in srgb, var(--accent) 10%, var(--bg-elevated));}
.day-cell.today .dnum{color:var(--accent);}
.day-cell .dnum{line-height:1;}
.day-dots{display:flex; gap:2px; margin-top:2px; flex-wrap:wrap; justify-content:center; max-width:100%;}
.day-dots span{width:5px; height:5px; border-radius:50%; flex-shrink:0;}
.day-dots span.note-dot{border-radius:1.5px; background:var(--text-muted);}
.day-note-badge{font-size:8.5px; font-weight:600; color:var(--text-muted); background:var(--bg-sunken); border-radius:5px; padding:1px 4px; margin-top:1px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- Year view ---------- */
.year-month{margin-bottom:20px;}
.year-month h3{font-size:14px; margin:0 0 8px 2px; font-weight:700;}
.year-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.year-cell{aspect-ratio:1/1; border-radius:4px; background:var(--bg-sunken);}
.year-cell.outside{opacity:0;}

/* ---------- Modals / sheets ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,10,16,.5); backdrop-filter:blur(2px); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fadein .2s ease;}
.sheet{width:100%; max-width:560px; background:var(--bg); border-radius:24px 24px 0 0; padding:10px 18px calc(22px + var(--safe-bottom)); max-height:90vh; overflow-y:auto; animation:sheetup .25s cubic-bezier(.2,.9,.3,1);}
@keyframes sheetup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:5px; background:var(--border); border-radius:99px; margin:6px auto 14px;}
.sheet h2{font-size:20px; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field-hint{font-size:12px; color:var(--text-muted); margin-top:6px; line-height:1.4;}
.type-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.type-chip{border-radius:14px; padding:12px 6px; text-align:center; border:2px solid var(--border); background:var(--bg-elevated); font-weight:700; font-size:12.5px; display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--text); transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;}
.type-chip svg{width:18px; height:18px;}
.type-chip.selected{border-color:currentColor; box-shadow:var(--shadow); background:color-mix(in srgb, currentColor 10%, var(--bg-elevated));}
.type-chip:active{transform:scale(.96);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.checkbox-row{display:flex; align-items:center; gap:10px; background:var(--bg-sunken); border-radius:12px; padding:12px 14px;}
.checkbox-row input{width:20px; height:20px; padding:0; flex-shrink:0; accent-color:var(--accent);}
.checkbox-row label{margin:0; font-size:13.5px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--text);}
.swatch-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.swatch{aspect-ratio:1/1; border-radius:10px; border:2px solid transparent; position:relative;}
.swatch.selected{border-color:var(--text);}
.swatch.selected::after{content:''; position:absolute; inset:0; border:2px solid var(--bg-elevated); border-radius:8px;}
.icon-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.icon-opt{aspect-ratio:1/1; border-radius:10px; border:1.5px solid var(--border); background:var(--bg-sunken); display:flex; align-items:center; justify-content:center; color:var(--text);}
.icon-opt svg{width:17px; height:17px;}
.icon-opt.selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--bg-sunken)); color:var(--accent);}
.btn{width:100%; padding:14px; border-radius:14px; border:none; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn svg{width:18px; height:18px; flex-shrink:0;}
.btn-primary{background:var(--accent); color:var(--accent-text);}
.btn-primary:active{transform:scale(.98);}
.btn-ghost{background:var(--bg-sunken); color:var(--text);}
.btn-danger{background:transparent; color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent);}
.btn:disabled{opacity:.5;}
.btn-row{display:flex; gap:10px; margin-top:6px;}
.btn-row .btn{flex:1;}
.dashline{border:none; border-top:1px dashed var(--border); margin:16px 0;}

/* ---------- Shift Types Manager ---------- */
.shifttype-row{display:flex; align-items:center; gap:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:12px 13px; margin-bottom:10px; box-shadow:var(--shadow);}
.shifttype-swatch{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.shifttype-swatch svg{width:19px; height:19px;}
.shifttype-info{flex:1; min-width:0;}
.shifttype-name{font-weight:700; font-size:14.5px;}
.shifttype-meta{font-size:12px; color:var(--text-muted); font-family:var(--font-mono); margin-top:2px;}
.shifttype-actions{display:flex; gap:4px;}
.shifttype-actions button{width:32px; height:32px; border-radius:9px; border:none; background:var(--bg-sunken); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.shifttype-actions button svg{width:15px; height:15px;}
.shifttype-actions button:active{transform:scale(.9);}

/* ---------- Metrics ---------- */
.modeToggle{display:flex; background:var(--bg-sunken); border-radius:12px; padding:3px; margin-bottom:16px;}
.modeToggle button{flex:1; border:none; background:transparent; padding:99px; padding:9px; border-radius:9px; font-weight:700; font-size:13px; color:var(--text-muted);}
.modeToggle button.active{background:var(--bg-elevated); color:var(--text); box-shadow:var(--shadow);}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.stat-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); opacity:.55;}
.stat-card .lab{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700; margin-bottom:6px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-key{width:96px; font-size:12.5px; font-weight:700; color:var(--text-muted); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{flex:1; height:10px; border-radius:6px; background:var(--bg-sunken); overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.bar-val{width:52px; text-align:right; font-family:var(--font-mono); font-size:12.5px; font-weight:600; flex-shrink:0;}

/* ---------- Swap card ---------- */
.swapcard-preview{border-radius:20px; overflow:hidden; box-shadow:var(--shadow-lg); margin-bottom:16px;}
.swapcard-preview img{width:100%; display:block;}

.toast{position:fixed; left:50%; bottom:calc(100px + var(--safe-bottom)); transform:translateX(-50%); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:600; z-index:90; box-shadow:var(--shadow-lg); animation:toastin .2s ease; max-width:88%; text-align:center;}
@keyframes toastin{from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);}}

/* ---------- Add / composer view ---------- */
.addview .composer-datebar{display:flex; align-items:center; gap:8px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px; padding:6px 6px; box-shadow:var(--shadow); margin-bottom:10px;}
.addview .composer-datebar .icon-btn{width:32px; height:32px; border-radius:10px;}
.addview .composer-datebar .icon-btn svg{width:16px; height:16px;}
.addview .dn-mid{flex:1; text-align:center; min-width:0;}
.addview .dn-dow{font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}
.addview .dn-date{font-size:15px; font-weight:700; margin-top:1px;}
.addview .today-jump{font-size:10.5px; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); border:none; border-radius:999px; padding:2px 8px; margin-top:2px;}
.addview .modeToggle{margin-bottom:16px;}
.addview .modeToggle button{display:flex; align-items:center; justify-content:center; gap:6px;}
.addview .modeToggle button svg{width:15px; height:15px;}
.addview .field{margin-bottom:12px;}
.addview .field label{margin-bottom:5px;}
.addview .type-grid{grid-template-columns:repeat(3,1fr); gap:6px;}
.addview .type-chip{padding:9px 4px; font-size:11.5px; gap:3px; border-radius:12px;}
.addview .type-chip svg{width:15px; height:15px;}
.addview textarea{min-height:52px; font-size:14px; padding:9px 11px;}
.addview .section-title{margin:18px 2px 8px;}
.addview .btn{padding:12px;}

.notelist{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.note-mini{display:flex; align-items:flex-start; gap:10px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px; padding:11px 12px;}
.note-mini p{flex:1; min-width:0; margin:0; font-size:13.5px; line-height:1.45; color:var(--text);}
.note-mini .note-mini-actions{display:flex; gap:4px; flex-shrink:0;}
.note-mini .note-mini-actions button{width:26px; height:26px; border-radius:8px; border:none; background:var(--bg-sunken); color:var(--text-muted); display:flex; align-items:center; justify-content:center;}
.note-mini .note-mini-actions button svg{width:13px; height:13px;}
.editing-banner{display:flex; align-items:center; justify-content:space-between; gap:8px; background:color-mix(in srgb, var(--accent) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); color:var(--accent); border-radius:12px; padding:8px 12px; font-size:12px; font-weight:700; margin-bottom:12px;}
.editing-banner button{background:none; border:none; color:var(--accent); font-weight:700; font-size:11.5px; text-decoration:underline;}

.legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:14px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-muted);}
.legend-dot{width:9px; height:9px; border-radius:3px;}

/* ---------- Modal Selector de Idioma ---------- */
.lang-overlay{position:fixed; inset:0; background:rgba(10,10,16,0.75); backdrop-filter:blur(6px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadein .2s ease;}
.lang-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:24px; padding:28px 24px; width:100%; max-width:380px; text-align:center; box-shadow:var(--shadow-lg); animation:sheetup .25s ease;}
.lang-card h2{font-size:22px; margin:0 0 8px;}
.lang-card p{font-size:14px; color:var(--text-muted); margin:0 0 24px; line-height:1.4;}
.lang-options{display:flex; flex-direction:column; gap:12px;}
.lang-btn{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-radius:16px; border:2px solid var(--border); background:var(--bg-sunken); font-weight:700; font-size:16px; color:var(--text); transition:all .15s ease;}
.lang-btn:active{transform:scale(.97); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--bg-sunken));}

::-webkit-scrollbar{width:0; height:0;}

/* ---------------- Curated color swatches for shift types ---------------- */
const SWATCHES = ['#6C5CE7','#FFA94D','#FF6B4A','#2DD4BF','#52B788','#FF5C8A','#4D96FF','#FFD93D','#E5484D','#8890A6','#5B5FEF','#22D3EE'];
function textColorFor(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.62 ? '#14161F' : '#FFFFFF';
}

/* ---------------- Date utils ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromDateStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function todayStr(){ return toDateStr(new Date()); }
function mondayIndex(d){ return (d.getDay()+6)%7; }
function timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtHuman(dateStr){
  const d = fromDateStr(dateStr);
  return t('weekdaysFull')[mondayIndex(d)]+', '+t('months')[d.getMonth()]+' '+d.getDate();
}
function fmtHumanShort(dateStr){
  const d = fromDateStr(dateStr);
  return t('months')[d.getMonth()].slice(0,3)+' '+d.getDate();
}
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function shiftDurationHours(type){
  if(!type || !type.isWork || !type.start || !type.end) return 0;
  let start = timeToMin(type.start), end = timeToMin(type.end);
  let mins = end - start;
  if(mins <= 0) mins += 1440;
  const brk = Number(type.breakMins)||0;
  return Math.max(0,(mins - brk))/60;
}

/* ---------------- Persistence ---------------- */
const DEFAULT_SETTINGS = {
  theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark':'light',
  lang: null // null activa la pantalla inicial
};
const DB = {
  async loadShiftTypes(){
    try{ const r = await window.storage.get('shiftTypes', false); return r ? JSON.parse(r.value) : []; }
    catch(e){ return []; }
  },
  async saveShiftTypes(arr){
    try{ await window.storage.set('shiftTypes', JSON.stringify(arr), false); }
    catch(e){ console.error('save shiftTypes failed', e); }
  },
  async loadShifts(){
    try{ const r = await window.storage.get('shifts', false); return r ? JSON.parse(r.value) : {}; }
    catch(e){ return {}; }
  },
  async saveShifts(obj){
    try{ await window.storage.set('shifts', JSON.stringify(obj), false); }
    catch(e){ console.error('save shifts failed', e); }
  },
  async loadNotes(){
    try{ const r = await window.storage.get('notes', false); return r ? JSON.parse(r.value) : {}; }
    catch(e){ return {}; }
  },
  async saveNotes(obj){
    try{ await window.storage.set('notes', JSON.stringify(obj), false); }
    catch(e){ console.error('save notes failed', e); }
  },
  async loadSettings(){
    try{ const r = await window.storage.get('settings', false); return r ? {...DEFAULT_SETTINGS, ...JSON.parse(r.value)} : {...DEFAULT_SETTINGS}; }
    catch(e){ return {...DEFAULT_SETTINGS}; }
  },
  async saveSettings(obj){
    try{ await window.storage.set('settings', JSON.stringify(obj), false); }
    catch(e){ console.error('save settings failed', e); }
  }
};

/* ---------------- State ---------------- */
const state = {
  shiftTypes: [],
  shifts: {},
  notes: {},
  settings: {...DEFAULT_SETTINGS},
  activeTab: 'day',
  selectedDate: todayStr(),
  monthCursor: { y: new Date().getFullYear(), m: new Date().getMonth() },
  yearCursor: new Date().getFullYear(),
  metricsPeriod: 'week',
  addCtx: { mode: 'shift', selectedTypeId: null, noteId: null },
};

function typeById(id){ return state.shiftTypes.find(t=>t.id===id); }
function entriesFor(dateStr){ return state.shifts[dateStr] || []; }
function notesFor(dateStr){ return state.notes[dateStr] || []; }

/* ---------------- Init ---------------- */
async function init(){
  const [shiftTypes, shifts, notes, settings] = await Promise.all([DB.loadShiftTypes(), DB.loadShifts(), DB.loadNotes(), DB.loadSettings()]);
  state.shiftTypes = shiftTypes;
  state.shifts = shifts;
  state.notes = notes;
  state.settings = settings;
  
  applyTheme();
  
  if(!state.settings.lang){
    showLanguageModal();
  } else {
    renderApp();
  }
}

function showLanguageModal(){
  const root = document.getElementById('lang-modal-root');
  root.innerHTML = `
    <div class="lang-overlay">
      <div class="lang-card">
        <h2>Idioma / Language</h2>
        <p>Selecciona tu idioma para continuar<br><span style="font-size:12px;opacity:0.8">Select your language to continue</span></p>
        <div class="lang-options">
          <button class="lang-btn" onclick="selectInitialLanguage('es')">
            <span>Español</span>
            <span>🇪🇸</span>
          </button>
          <button class="lang-btn" onclick="selectInitialLanguage('en')">
            <span>English</span>
            <span>🇬🇧</span>
          </button>
        </div>
      </div>
    </div>
  `;
}

function selectInitialLanguage(lang){
  state.settings.lang = lang;
  DB.saveSettings(state.settings);
  document.getElementById('lang-modal-root').innerHTML = '';
  renderApp();
}

function applyTheme(){
  document.documentElement.classList.toggle('dark', state.settings.theme === 'dark');
  document.getElementById('themeBtn').innerHTML = state.settings.theme === 'dark' ? ICONS.sunTheme : ICONS.moonTheme;
  const mc = document.querySelector('meta[name="theme-color"]');
  if(mc) mc.setAttribute('content', state.settings.theme==='dark' ? '#14161F' : '#F7F7F3');
}
function toggleTheme(){
  state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  DB.saveSettings(state.settings);
}
function setTab(tab){
  state.activeTab = tab;
  renderApp();
}

/* ---------------- App shell render ---------------- */
function renderApp(){
  // Actualizar textos de navegación
  document.getElementById('nav-lbl-day').textContent = t('navDay');
  document.getElementById('nav-lbl-month').textContent = t('navMonth');
  document.getElementById('nav-lbl-year').textContent = t('navYear');
  document.getElementById('nav-lbl-add').textContent = t('navAdd');

  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.activeTab));
  document.getElementById('metricsHdrBtn').classList.toggle('accent', state.activeTab==='metrics');

  if(state.activeTab==='day'){ root.innerHTML = renderDayView(); scrollTimelineIntoView(); }
  else if(state.activeTab==='month') root.innerHTML = renderMonthView();
  else if(state.activeTab==='year') root.innerHTML = renderYearView();
  else if(state.activeTab==='metrics') root.innerHTML = renderMetrics();
  else if(state.activeTab==='add') root.innerHTML = renderAddView();
}

/* ================= DAY VIEW (hourly timeline) ================= */
const HOUR_H = 56;
function renderDayView(){
  const dateStr = state.selectedDate;
  const isToday = dateStr === todayStr();
  const entries = entriesFor(dateStr);
  const dayNotes = notesFor(dateStr);

  const timedEntries = entries.filter(e=>{ const t=typeById(e.typeId); return t && t.isWork && t.start && t.end; });
  const allDayEntries = entries.filter(e=>{ const t=typeById(e.typeId); return !t || !(t.isWork && t.start && t.end); });

  let body = '';
  if(entries.length === 0 && dayNotes.length === 0){
    body = `<div class="empty-state">
      ${ICONS.calBlank}
      <div class="title">${t('nothingScheduled')}</div>
      <div>${t('useAddTab')}</div>
    </div>`;
  } else {
    if(allDayEntries.length || dayNotes.length){
      body += `<div class="section-title" style="margin-top:0">${t('allDay')}</div>`;
      body += '<div class="agenda-list">'
        + allDayEntries.map(e => renderAgendaItem(e, dateStr)).join('')
        + dayNotes.map(n => renderNoteAgendaItem(n, dateStr)).join('')
        + '</div>';
    }
    if(timedEntries.length){
      body += `<div class="section-title">${t('timeline')}</div>`;
      body += renderTimeline(timedEntries, dateStr);
    } else if(allDayEntries.length || dayNotes.length){
      body += `<div class="text-muted" style="font-size:13px; margin-top:14px">${t('noTimedShifts')}</div>`;
    }
  }
  body += `<div class="quickadd-row">
    <button class="add-shift-row" onclick="goAddShift()">${ICONS.plus} ${t('addShift')}</button>
    <button class="add-shift-row" onclick="goAddNote()">${ICONS.note} ${t('addNote')}</button>
  </div>`;
  if(state.shiftTypes.length === 0){
    body += `<div class="card" style="margin-top:16px">
      <div style="font-weight:700;font-size:14.5px;margin-bottom:6px">${t('createFirstType')}</div>
      <div class="text-muted" style="font-size:13px;line-height:1.5;margin-bottom:12px">${t('createFirstTypeDesc')}</div>
      <button class="btn btn-primary" onclick="openShiftTypesManager()">${ICONS.layers} ${t('manageTypes')}</button>
    </div>`;
  }

  return `
    <div class="dateflip">
      <button class="icon-btn" onclick="shiftDay(-1)">${ICONS.chevL}</button>
      <div style="text-align:center">
        <div class="today-label">${isToday?t('today'):t('weekdaysFull')[mondayIndex(fromDateStr(dateStr))]}</div>
        <h2 class="date-heading">${fmtHumanShort(dateStr)}</h2>
      </div>
      <button class="icon-btn" onclick="shiftDay(1)">${ICONS.chevR}</button>
    </div>
    ${body}
  `;
}
function renderTimeline(timedEntries, dateStr){
  const hourRows = [];
  for(let h=0; h<24; h++){
    hourRows.push(`<div class="hour-row"><span class="hour-label">${pad(h)}:00</span></div>`);
  }
  const events = timedEntries.map(e=>{
    const t = typeById(e.typeId);
    const startMin = timeToMin(t.start);
    let endMin = timeToMin(t.end);
    const crossesMidnight = endMin <= startMin;
    if(crossesMidnight) endMin = 24*60;
    const top = (startMin/60)*HOUR_H;
    const height = Math.max(30, ((endMin-startMin)/60)*HOUR_H - 2);
    return `<div class="timeline-event" style="top:${top}px;height:${height}px;background:${t.color};color:${textColorFor(t.color)}" onclick="openShiftModal('${dateStr}','${e.id}')">
      <div class="te-name">${escapeHtml(t.name)}${crossesMidnight?' ›':''}</div>
      <div class="te-time">${t.start}–${t.end}</div>
      ${e.notes && height>50 ? `<div class="te-notes">${escapeHtml(e.notes)}</div>` : ''}
    </div>`;
  }).join('');
  let nowLine = '';
  if(dateStr === todayStr()){
    const now = new Date();
    const top = ((now.getHours()*60+now.getMinutes())/60)*HOUR_H;
    nowLine = `<div class="now-line" style="top:${top}px"><span></span></div>`;
  }
  return `<div class="timeline-wrap" style="height:${24*HOUR_H}px">
    <div class="timeline-hours">${hourRows.join('')}</div>
    <div class="timeline-events">${events}${nowLine}</div>
  </div>`;
}
function scrollTimelineIntoView(){
  requestAnimationFrame(()=>{
    const el = document.querySelector('.now-line') || document.querySelector('.timeline-event');
    if(el && el.scrollIntoView) el.scrollIntoView({block:'center'});
  });
}
function renderAgendaItem(entry, dateStr){

    <div class="agenda-body">
      <div class="agenda-title-row">
        <div class="agenda-name">${escapeHtml(tType.name)}</div>

      ${entry.notes?`<div class="agenda-notes">${escapeHtml(entry.notes)}</div>`:''}
    </div>

function renderNoteAgendaItem(note, dateStr){

      <button onclick="deleteNoteEntry('${dateStr}','${note.id}')" aria-label="Delete note">${ICONS.trash}</button>
    </div>

function shiftDay(n){
  state.selectedDate = toDateStr(addDays(fromDateStr(state.selectedDate), n));
  renderApp();
}
function deleteShiftEntry(dateStr, entryId){
  if(!state.shifts[dateStr]) return;
  state.shifts[dateStr] = state.shifts[dateStr].filter(e=>e.id!==entryId);
  if(state.shifts[dateStr].length===0) delete state.shifts[dateStr];
  DB.saveShifts(state.shifts);
  renderApp();
  showToast(t('shiftRemoved'));
}
function deleteNoteEntry(dateStr, noteId){
  if(!state.notes[dateStr]) return;
  state.notes[dateStr] = state.notes[dateStr].filter(n=>n.id!==noteId);
  if(state.notes[dateStr].length===0) delete state.notes[dateStr];
  DB.saveNotes(state.notes);
  renderApp();
  showToast(t('noteRemoved'));
}
function editNoteInline(dateStr, noteId){
  state.selectedDate = dateStr;
  state.addCtx.mode = 'note';
  state.addCtx.noteId = noteId;
  setTab('add');
}
function goAddShift(){
  state.addCtx.mode = 'shift';
  state.addCtx.noteId = null;
  if(!state.addCtx.selectedTypeId && state.shiftTypes.length) state.addCtx.selectedTypeId = state.shiftTypes[0].id;
  setTab('add');
}
function goAddNote(){
  state.addCtx.mode = 'note';
  state.addCtx.noteId = null;
  setTab('add');
}

/* ================= MONTH VIEW ================= */
function renderMonthView(){
  const {y,m} = state.monthCursor;
  const first = new Date(y,m,1);
  const startOffset = mondayIndex(first);
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){
    const d = addDays(first, -(startOffset-i));
    cells.push({date:d, outside:true});
  }
  for(let d=1; d<=daysInMonth; d++) cells.push({date:new Date(y,m,d), outside:false});
  while(cells.length % 7 !== 0) cells.push({date:addDays(cells[cells.length-1].date,1), outside:true});

  const todaystr = todayStr();
  const gridHtml = cells.map(c=>{
    const dstr = toDateStr(c.date);
    const entries = entriesFor(dstr);
    const dayNotes = notesFor(dstr);
    let dots = entries.slice(0,3).map(e=>{ const tType=typeById(e.typeId); return tType?`<span style="background:${tType.color}"></span>`:''; }).join('');
    if(dayNotes.length) dots += `<span class="note-dot"></span>`;
    const noteText = (entries.find(e=>e.notes)||{}).notes || (dayNotes[0]&&dayNotes[0].text) || '';
    const noteBadge = noteText ? `<div class="day-note-badge">${escapeHtml(noteText.split(' ').slice(0,2).join(' '))}</div>` : '';
    return `<button class="day-cell ${c.outside?'outside':''} ${dstr===todaystr?'today':''}" onclick="goToDay('${dstr}')">
      <span class="dnum">${c.date.getDate()}</span>
      ${dots?`<div class="day-dots">${dots}</div>`:''}
      ${noteBadge}
    </button>`;
  }).join('');

  return `
    <div class="dateflip">
      <button class="icon-btn" onclick="shiftMonth(-1)">${ICONS.chevL}</button>
      <div style="text-align:center">
        <h2 class="date-heading" style="font-size:20px">${t('months')[m]} ${y}</h2>
      </div>
      <button class="icon-btn" onclick="shiftMonth(1)">${ICONS.chevR}</button>
    </div>
    <div class="month-grid-head">${t('weekdaysShort').map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="month-grid">${gridHtml}</div>
    ${legendHtml()}
  `;
}
function legendHtml(){
  if(!state.shiftTypes.length) return '';
  return `<div class="legend">${state.shiftTypes.map(t=>`<div class="legend-item"><span class="legend-dot" style="background:${t.color}"></span>${escapeHtml(t.name)}</div>`).join('')}</div>`;
}
function goToDay(dstr){
  state.selectedDate = dstr;
  state.activeTab = 'day';
  renderApp();
}
function shiftMonth(n){
  let {y,m} = state.monthCursor;
  m += n;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.monthCursor = {y,m};
  renderApp();
}

/* ================= YEAR VIEW ================= */
function renderYearView(){
  const y = state.yearCursor;
  let months = '';
  for(let m=0;m<12;m++){
    const first = new Date(y,m,1);
    const startOffset = mondayIndex(first);
    const daysInMonth = new Date(y,m+1,0).getDate();
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += `<div class="year-cell outside"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dstr = toDateStr(new Date(y,m,d));
      const entries = entriesFor(dstr);
      const tType = entries.length ? typeById(entries[0].typeId) : null;
      cells += `<button class="year-cell" style="background:${tType?tType.color:'var(--bg-sunken)'}" onclick="goToDay('${dstr}')" title="${dstr}"></button>`;
    }
    months += `<div class="year-month"><h3>${t('months')[m]}</h3><div class="year-grid">${cells}</div></div>`;
  }
  return `
    <div class="dateflip">
      <button class="icon-btn" onclick="shiftYear(-1)">${ICONS.chevL}</button>
      <h2 class="date-heading">${y}</h2>
      <button class="icon-btn" onclick="shiftYear(1)">${ICONS.chevR}</button>
    </div>
    ${months}
    ${legendHtml()}
  `;
}
function shiftYear(n){ state.yearCursor += n; renderApp(); }

/* ================= METRICS ================= */
function renderMetrics(){
  const period = state.metricsPeriod;
  const today = new Date();
  let rangeDates = [];
  if(period === 'week'){
    const monIdx = mondayIndex(today);
    const monday = addDays(today, -monIdx);
    for(let i=0;i<7;i++) rangeDates.push(toDateStr(addDays(monday,i)));
  } else {
    const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
    for(let d=1; d<=daysInMonth; d++) rangeDates.push(toDateStr(new Date(today.getFullYear(), today.getMonth(), d)));
  }

  let totalHours = 0, daysWorked = 0, offDays = 0, vacationDays = 0;
  const byType = {};
  state.shiftTypes.forEach(t => byType[t.id] = 0);

  rangeDates.forEach(dstr=>{
    const entries = entriesFor(dstr);
    if(!entries.length) return;
    let workedToday = false, offToday = false, vacToday = false;
    entries.forEach(e=>{
      const tType = typeById(e.typeId);
      if(!tType) return;
      if(tType.isWork){
        const h = shiftDurationHours(tType);
        totalHours += h;
        byType[tType.id] = (byType[tType.id]||0) + h;
        workedToday = true;
      } else {
        offToday = true;
        if(/vacation|holiday|pto|leave|vacaciones/i.test(tType.name)) vacToday = true;
      }
    });
    if(workedToday) daysWorked++;
    if(offToday && !workedToday) offDays++;
    if(vacToday) vacationDays++;
  });

  const maxTypeHours = Math.max(1, ...Object.values(byType));
  const breakdownRows = state.shiftTypes.filter(t=>t.isWork).map(tType=>{
    const h = byType[tType.id]||0;
    return `<div class="bar-row">
      <div class="bar-key">${escapeHtml(tType.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(h/maxTypeHours*100).toFixed(0)}%;background:${tType.color}"></div></div>
      <div class="bar-val">${h.toFixed(1)}h</div>
    </div>`;
  }).join('');

  return `
    <div class="section-title" style="margin-top:0">${t('metrics')}</div>
    <div class="modeToggle">
      <button class="${period==='week'?'active':''}" onclick="setMetricsPeriod('week')">${t('thisWeek')}</button>
      <button class="${period==='month'?'active':''}" onclick="setMetricsPeriod('month')">${t('thisMonth')}</button>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="lab">${t('hoursWorked')}</div><div class="big-num">${totalHours.toFixed(1)}<span style="font-size:14px;color:var(--text-muted)"> h</span></div></div>
      <div class="stat-card"><div class="lab">${t('daysWorked')}</div><div class="big-num">${daysWorked}</div></div>

function applyRangeAssign(){
  const { typeId, from, to, replace } = _rangeCtx;
  if(!from || !to || from > to){ showToast(t('checkDateRange')); return; }
  let d = fromDateStr(from);
  const end = fromDateStr(to);
  let count = 0;
  while(d <= end){
    const dstr = toDateStr(d);
    if(replace || !state.shifts[dstr]) state.shifts[dstr] = [];
    state.shifts[dstr].push({ id: uid(), typeId, notes:'' });

    d = addDays(d,1);
  }
  DB.saveShifts(state.shifts);
  closeModal();
  renderApp();
  showToast(`${t('appliedTo')} ${count} ${count===1?t('day'):t('days')}`);
}

/* ================= ICS EXPORT ================= */
function exportICS(){
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rota//Shift Calendar//EN'];
  Object.keys(state.shifts).sort().forEach(dstr=>{
    entriesFor(dstr).forEach(e=>{
      const tType = typeById(e.typeId);
      if(!tType) return;
      const dNoDash = dstr.replace(/-/g,'');
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+e.id+'@rota');
      lines.push('SUMMARY:'+escapeICS(tType.name));
      if(tType.isWork && tType.start && tType.end){
        const startMin = timeToMin(tType.start);
        let endMin = timeToMin(tType.end);
        let endDate = fromDateStr(dstr);
        if(endMin <= startMin){ endDate = addDays(endDate,1); }
        lines.push('DTSTART:'+dNoDash+'T'+tType.start.replace(':','')+'00');
        lines.push('DTEND:'+toDateStr(endDate).replace(/-/g,'')+'T'+tType.end.replace(':','')+'00');
      } else {
        lines.push('DTSTART;VALUE=DATE:'+dNoDash);
        lines.push('DTEND;VALUE=DATE:'+toDateStr(addDays(fromDateStr(dstr),1)).replace(/-/g,''));
      }
      if(e.notes) lines.push('DESCRIPTION:'+escapeICS(e.notes));
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rota-shifts.ics';
  a.click();
  showToast(t('calendarDownloaded'));
}
function escapeICS(s){ return String(s).replace(/[\\;,]/g, m=>'\\'+m).replace(/\n/g,'\\n'); }

/* ================= SWAP CARD (canvas share image) ================= */
function openSwapCard(dateStr, entryId){
  const entry = entriesFor(dateStr).find(e=>e.id===entryId);
  const tType = entry ? typeById(entry.typeId) : null;
  if(!entry || !tType) return;
  const canvas = document.createElement('canvas');
  drawSwapCard(canvas, dateStr, entry, tType);
  const imgUrl = canvas.toDataURL('image/png');
  const html = `
    <div class="sheet-handle"></div>
    <h2>${t('swapCardTitle')}</h2>
    <div class="swapcard-preview"><img src="${imgUrl}"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick='downloadSwapCard(${JSON.stringify(dateStr)}, ${JSON.stringify(entryId)})'>${ICONS.download}${t('download')}</button>
      <button class="btn btn-primary" onclick='copySwapCard(${JSON.stringify(dateStr)}, ${JSON.stringify(entryId)})'>${ICONS.copy}${t('copyImage')}</button>
    </div>
  `;
  showSheet(html);
}
function drawSwapCard(canvas, dateStr, entry, tType){
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const hex = tType.color;
  const textHex = textColorFor(hex);
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, shadeColor(hex,14));
  grad.addColorStop(1, shadeColor(hex,-18));
  ctx.fillStyle = grad;
  roundRect(ctx,0,0,W,H,48); ctx.fill();

  ctx.fillStyle = textHex;
  ctx.globalAlpha = .85;
  ctx.font = '600 30px Inter, sans-serif';
  ctx.fillText(t('shiftSwapRequest'), 64, 96);
  ctx.globalAlpha = 1;

  ctx.font = '700 74px "Space Grotesk", sans-serif';
  ctx.fillText(fmtHuman(dateStr), 60, 210, W-120);

  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  roundRect(ctx,60,290,W-120,H-290-220,36); ctx.fill();

  ctx.fillStyle = '#14161F';
  ctx.font = '700 46px "Space Grotesk", sans-serif';
  ctx.fillText(tType.name + ' ' + t('shiftWord'), 104, 380);

  ctx.fillStyle = '#6B6D7A';
  ctx.font = '600 30px "JetBrains Mono", monospace';
  if(tType.isWork){
    ctx.fillText(tType.start + '  –  ' + tType.end, 104, 430);
    ctx.fillStyle = '#14161F';
    ctx.font = '700 88px "JetBrains Mono", monospace';
    ctx.fillText(shiftDurationHours(tType).toFixed(1)+'h', 104, 560);
    ctx.fillStyle = '#6B6D7A';
    ctx.font = '600 26px Inter, sans-serif';
    ctx.fillText(t('totalHours') + (tType.breakMins?`  ·  ${tType.breakMins}m ${t('breakWord')}`:''), 104, 605);
  }
  if(entry.notes){
    ctx.fillStyle = '#14161F';
    ctx.font = '500 28px Inter, sans-serif';
    wrapText(ctx, entry.notes, 104, 700, W-120-88, 38);
  }

  ctx.fillStyle = textHex;
  ctx.globalAlpha = .9;
  ctx.font = '600 26px Inter, sans-serif';
  ctx.fillText(t('generatedWith'), 64, H-70);
}
function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#',''),16);
  let r=(num>>16), g=(num>>8&0x00FF), b=(num&0x0000FF);
  r=Math.min(255,Math.max(0,r+Math.round(2.55*percent)));
  g=Math.min(255,Math.max(0,g+Math.round(2.55*percent)));
  b=Math.min(255,Math.max(0,b+Math.round(2.55*percent)));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let cy = y;
  for(const w of words){
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, cy);
      line = w + ' ';
      cy += lineHeight;
    } else line = test;
  }
  ctx.fillText(line, x, cy);
}
function downloadSwapCard(dateStr, entryId){
  const entry = entriesFor(dateStr).find(e=>e.id===entryId);
  const tType = entry ? typeById(entry.typeId) : null;
  if(!entry || !tType) return;
  const canvas = document.createElement('canvas');
  drawSwapCard(canvas, dateStr, entry, tType);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `shift-swap-${dateStr}.png`;
  a.click();
  showToast(t('imgDownloaded'));
}
async function copySwapCard(dateStr, entryId){
  const entry = entriesFor(dateStr).find(e=>e.id===entryId);
  const tType = entry ? typeById(entry.typeId) : null;
  if(!entry || !tType) return;
  const canvas = document.createElement('canvas');
  drawSwapCard(canvas, dateStr, entry, tType);
  try{
    canvas.toBlob(async (blob)=>{
      if(navigator.clipboard && window.ClipboardItem){
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        showToast(t('copiedClipboard'));
      } else {
        downloadSwapCard(dateStr, entryId);
      }
    });
  }catch(e){
    downloadSwapCard(dateStr, entryId);
  }
}

    <h2>${t('settings')}</h2>
    <div class="field">
      <label>${t('language')}</label>
      <div class="modeToggle">
        <button class="${state.settings.lang==='es'?'active':''}" onclick="setLanguageExplicit('es')">Español 🇪🇸</button>
        <button class="${state.settings.lang==='en'?'active':''}" onclick="setLanguageExplicit('en')">English 🇬🇧</button>
      </div>
    </div>
    <div class="field">
      <label>${t('appearance')}</label>
      <div class="modeToggle">
        <button class="${state.settings.theme==='light'?'active':''}" onclick="setThemeExplicit('light')">${t('light')}</button>
        <button class="${state.settings.theme==='dark'?'active':''}" onclick="setThemeExplicit('dark')">${t('dark')}</button>
      </div>
    </div>
    <div class="section-title" style="margin-top:6px">${t('export')}</div>
    <button class="btn btn-ghost" style="margin-bottom:14px" onclick="exportICS()">${ICONS.download}${t('exportIcs')}</button>
    <div class="section-title">${t('data')}</div>
    <div class="card" style="margin-bottom:14px">

}
function setLanguageExplicit(lang){
  state.settings.lang = lang;
  DB.saveSettings(state.settings);
  openSettings();
  renderApp();
}
function setThemeExplicit(theme){
  state.settings.theme = theme;
  applyTheme();
  DB.saveSettings(state.settings);
  openSettings();
}
function clearAllData(){
  state.shifts = {};
  DB.saveShifts(state.shifts);
  closeModal();
  renderApp();
  showToast(t('allShiftsCleared'));
}

/* ================= Toast ================= */
let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const tDiv = document.createElement('div');
  tDiv.className='toast';
  tDiv.textContent = msg;
  document.body.appendChild(tDiv);
  toastTimer = setTimeout(()=>tDiv.remove(), 2200);
}

init();
</script>
